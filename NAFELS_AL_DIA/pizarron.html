<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080f;--card:#0d0e1a;--card2:#111220;
  --border:rgba(255,255,255,.08);
  --red:#e8192c;--green:#22c55e;--amber:#f59e0b;
  --indigo:#818cf8;--orange:#f97316;--mut:#475569;--txt:#e2e8f0;
}
body{background:var(--bg);font-family:'Barlow Condensed',sans-serif;color:var(--txt);min-height:100vh;}
select,select option{color:#111!important;background:#fff!important;}

/* HEADER */
.header{padding:12px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.01);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:5px;background:linear-gradient(120deg,#e8192c,#fff 50%,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-right{display:flex;align-items:center;gap:12px;}
.back-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--mut);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-decoration:none;text-transform:uppercase;}
.back-btn:hover{color:var(--txt);}

/* CONTROLES */
.controles{padding:14px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.01);}
.ctrl-label{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;}
.ctrl-sel{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;outline:none;}
.ctrl-sel:focus{border-color:rgba(232,25,44,.4);}
.jchip{padding:6px 11px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--mut);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.4px;cursor:pointer;transition:.12s;}
.jchip:hover{color:#fff;}
.jchip.on{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4);color:#4ade80;}
.btn-fullscreen{padding:7px 16px;border-radius:8px;border:1px solid rgba(129,140,248,.3);background:rgba(129,140,248,.08);color:#818cf8;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .15s;}
.btn-fullscreen:hover{background:rgba(129,140,248,.2);}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.5);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* MAIN */
.main{padding:20px 28px;max-width:1800px;margin:0 auto;}
.dia-titulo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:5px;margin-bottom:20px;color:var(--red);display:flex;align-items:center;gap:12px;}
.dia-titulo::after{content:'';flex:1;height:1px;background:rgba(232,25,44,.2);}

/* BLOQUE */
.bloque{margin-bottom:24px;}
.bloque-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.bloque-icon{font-size:18px;}
.bloque-nombre{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;}

/* TABLA EJERCICIO */
.ejercicio-wrap{margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.ejercicio-titulo{padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--card2);}
.ej-num{width:24px;height:24px;border-radius:6px;background:rgba(232,25,44,.1);border:1px solid rgba(232,25,44,.2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--red);flex-shrink:0;}
.ej-nombre{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1.5px;flex:1;}
.ej-badges{display:flex;gap:6px;}
.ej-badge{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
.badge-s{background:rgba(129,140,248,.1);color:#818cf8;border:1px solid rgba(129,140,248,.2);}
.badge-r{background:rgba(34,197,94,.1);color:#22c55e;border:1px solid rgba(34,197,94,.2);}
.badge-d{background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.2);}
.badge-c{background:rgba(45,212,191,.12);color:#2dd4bf;border:1px solid rgba(45,212,191,.24);}
.ej-video-btn{padding:4px 10px;border-radius:6px;border:1px solid rgba(129,140,248,.2);background:rgba(129,140,248,.08);color:#818cf8;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;text-decoration:none;}
.ej-video-btn:hover{background:rgba(129,140,248,.2);}
.ej-video-btn.off{opacity:.3;pointer-events:none;}

/* TABLA JUGADORES */
.tabla-jugadores{width:100%;border-collapse:collapse;}
.tabla-jugadores th{padding:7px 12px;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--border);text-align:left;}
.tabla-jugadores th.center{text-align:center;}
.tabla-jugadores td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.03);font-size:13px;}
.tabla-jugadores tr:last-child td{border-bottom:none;}
.tabla-jugadores tr:hover td{background:rgba(255,255,255,.02);}

.jug-num{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--mut);width:32px;}
.jug-nombre{font-weight:700;letter-spacing:.5px;}
.jug-pos{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700;text-transform:uppercase;}
.pos-CENTRAL{background:rgba(249,115,22,.1);color:#f97316;}
.pos-PUNTA{background:rgba(34,197,94,.1);color:#22c55e;}
.pos-ARMADOR{background:rgba(245,158,11,.1);color:#f59e0b;}
.pos-OPUESTO{background:rgba(129,140,248,.1);color:#818cf8;}
.pos-LIBERO{background:rgba(6,182,212,.1);color:#06b6d4;}

/* INPUT DE PESO EN LA TABLA */
.peso-cell{text-align:center;}
.peso-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.serie-lbl{font-size:8px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;}
.peso-inp{width:58px;padding:5px 4px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--txt);font-family:'Bebas Neue',sans-serif;font-size:17px;text-align:center;outline:none;transition:all .15s;}
.peso-inp:focus{border-color:rgba(232,25,44,.4);background:rgba(232,25,44,.05);}
.peso-inp::placeholder{color:var(--mut);font-size:11px;}
.peso-inp.filled{border-color:rgba(34,197,94,.3);color:var(--green);}
.series-grid{display:flex;gap:6px;justify-content:center;}

/* PANTALLA VACÍA */
.empty{text-align:center;padding:60px;color:var(--mut);}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-txt{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;}
.empty-sub{font-size:12px;margin-top:6px;}

/* FULLSCREEN */
body.fullscreen .header{display:none;}
body.fullscreen .controles{display:none;}
body.fullscreen .main{padding:16px;max-width:100%;}
body.fullscreen{background:#000;}

@media(max-width:768px){
  .controles{padding:10px 16px;}
  .main{padding:12px 16px;}
  .tabla-jugadores{font-size:12px;}
  .peso-inp{width:48px;font-size:14px;}
  .series-grid{gap:3px;}
}
</style>
</head>

<script>
var PREP_DATA_LOCAL = window.PREP_DATA || null;
var EQUIPO_DATA_LOCAL = window.EQUIPO_DATA || null;

// ── Rutinas del equipo desde Firebase (las que arma el PF en el builder) ──
var RUTINAS_RAW = {};   // num -> { mesKey -> rutina }
var MES_ACTUAL = null;
var MESES_PZ = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function mesLabelFromKey(k){ var p=String(k).split('-'); return (MESES_PZ[(+p[1])-1]||'')+' '+(p[0]||''); }

/* ══ El nombre del BLOQUE en el idioma elegido ═════════════════════════════
   Los bloques (FUERZA SUPERIOR, CORE, MOVILIDAD) los escribe el preparador en
   la rutina. prep_fisica.html ya tenia esta tabla y el pizarron no: por eso el
   perfil individual mostraba "UPPER BODY STRENGTH" y la tele seguia en
   castellano. Es la misma tabla, para que las dos pantallas digan lo mismo. */
var PF_BLOQUES = {
  en:{'FUERZA SUPERIOR':'UPPER BODY STRENGTH','FUERZA INFERIOR':'LOWER BODY STRENGTH','TREN SUPERIOR':'UPPER BODY','TREN INFERIOR':'LOWER BODY',
      'CORE':'CORE','ABDOMINALES':'ABS','ABDOMINAL':'ABS','MOVILIDAD':'MOBILITY','POTENCIA':'POWER','PLIOMETRIA':'PLYOMETRICS','PLIOMETRÍA':'PLYOMETRICS',
      'RESISTENCIA':'ENDURANCE','VELOCIDAD':'SPEED','SALTO':'JUMP','CALENTAMIENTO':'WARM-UP','ENTRADA EN CALOR':'WARM-UP','ESTIRAMIENTO':'STRETCHING',
      'ELONGACION':'STRETCHING','ELONGACIÓN':'STRETCHING','PECHO':'CHEST','ESPALDA':'BACK','PIERNAS':'LEGS','BRAZOS':'ARMS','HOMBROS':'SHOULDERS',
      'GLUTEOS':'GLUTES','GLÚTEOS':'GLUTES','BICEPS':'BICEPS','BÍCEPS':'BICEPS','TRICEPS':'TRICEPS','TRÍCEPS':'TRICEPS','FUERZA':'STRENGTH',
      'PREVENCION':'PREHAB','PREVENCIÓN':'PREHAB','ACTIVACION':'ACTIVATION','ACTIVACIÓN':'ACTIVATION','CIRCUITO':'CIRCUIT','GIMNASIO':'GYM',
      'FISICO':'PHYSICAL','FÍSICO':'PHYSICAL','TECNICA':'TECHNIQUE','TÉCNICA':'TECHNIQUE'},
  de:{'FUERZA SUPERIOR':'OBERKÖRPERKRAFT','FUERZA INFERIOR':'UNTERKÖRPERKRAFT','TREN SUPERIOR':'OBERKÖRPER','TREN INFERIOR':'UNTERKÖRPER',
      'CORE':'CORE','ABDOMINALES':'BAUCH','ABDOMINAL':'BAUCH','MOVILIDAD':'MOBILITÄT','POTENCIA':'KRAFT','PLIOMETRIA':'PLYOMETRIE','PLIOMETRÍA':'PLYOMETRIE',
      'RESISTENCIA':'AUSDAUER','VELOCIDAD':'SCHNELLIGKEIT','SALTO':'SPRUNG','CALENTAMIENTO':'AUFWÄRMEN','ENTRADA EN CALOR':'AUFWÄRMEN','ESTIRAMIENTO':'DEHNEN',
      'ELONGACION':'DEHNEN','ELONGACIÓN':'DEHNEN','PECHO':'BRUST','ESPALDA':'RÜCKEN','PIERNAS':'BEINE','BRAZOS':'ARME','HOMBROS':'SCHULTERN',
      'GLUTEOS':'GESÄSS','GLÚTEOS':'GESÄSS','BICEPS':'BIZEPS','BÍCEPS':'BIZEPS','TRICEPS':'TRIZEPS','TRÍCEPS':'TRIZEPS','FUERZA':'KRAFT',
      'PREVENCION':'PRÄVENTION','PREVENCIÓN':'PRÄVENTION','ACTIVACION':'AKTIVIERUNG','ACTIVACIÓN':'AKTIVIERUNG','CIRCUITO':'ZIRKEL','GIMNASIO':'FITNESSSTUDIO',
      'FISICO':'KÖRPERLICH','FÍSICO':'KÖRPERLICH','TECNICA':'TECHNIK','TÉCNICA':'TECHNIK'}
};
function bloqueNombre(nombre){
  var l = (typeof getLang==='function') ? getLang() : 'es';
  if(l==='es' || !nombre) return nombre;
  var d = PF_BLOQUES[l] || {};
  return d[(''+nombre).trim().toUpperCase()] || nombre;
}

/* ══ Los dias de la rutina ═════════════════════════════════════════════════
   Las etiquetas las escribe el preparador y son libres: "lunes, miercoles,
   viernes", "martes y jueves", "miercoles". No hay forma de tenerlas todas en
   un diccionario, porque las combinaciones son infinitas.

   Por eso se traducen las PALABRAS dentro del texto —los dias y el "y" que los
   une— y se respeta el resto tal cual. Asi funciona con cualquier combinacion
   que se le ocurra escribir, hoy y en el futuro.

   Se traduce solo al PINTAR: la etiqueta original es la que identifica al dia
   dentro de la rutina, y si se tocara ahi se perderia la correspondencia. */
var PZ_DIAS = {
  en:{'lunes':'Monday','martes':'Tuesday','miercoles':'Wednesday','miércoles':'Wednesday',
      'jueves':'Thursday','viernes':'Friday','sabado':'Saturday','sábado':'Saturday','domingo':'Sunday',
      'lun':'Mon','mar':'Tue','mie':'Wed','mié':'Wed','jue':'Thu','vie':'Fri','sab':'Sat','sáb':'Sat','dom':'Sun',
      'y':'and','dia':'day','día':'day','semana':'week'},
  de:{'lunes':'Montag','martes':'Dienstag','miercoles':'Mittwoch','miércoles':'Mittwoch',
      'jueves':'Donnerstag','viernes':'Freitag','sabado':'Samstag','sábado':'Samstag','domingo':'Sonntag',
      'lun':'Mo','mar':'Di','mie':'Mi','mié':'Mi','jue':'Do','vie':'Fr','sab':'Sa','sáb':'Sa','dom':'So',
      'y':'und','dia':'Tag','día':'Tag','semana':'Woche'}
};
function diaTexto(txt){
  var l = (typeof getLang==='function') ? getLang() : 'es';
  if(l==='es' || !txt) return txt;
  var d = PZ_DIAS[l] || {};
  return String(txt).replace(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+/g, function(p){
    var t = d[p.toLowerCase()];
    if(!t) return p;                                  /* palabra que no es un dia: se deja */
    if(p === p.toUpperCase() && p.length > 1) return t.toUpperCase();
    if(p[0] === p[0].toUpperCase()) return t.charAt(0).toUpperCase() + t.slice(1);
    return t;
  });
}

/* ══ El nombre del ejercicio en el idioma elegido ═══════════════════════════
   Los ejercicios NO se traducen con el diccionario general: cada uno ya trae
   sus nombres en el catalogo (campos es / en / de), cargados por el preparador.
   Es la misma resolucion que usa prep_fisica.html, para que las dos pantallas
   muestren exactamente lo mismo.

   Se busca primero por id —que es lo que guardan las rutinas nuevas— y si no,
   por el nombre en castellano, para las rutinas viejas que se cargaron antes
   de que existieran los ids. Si no aparece, queda el nombre original. */
function ejNombre(id, fallback){
  var lang = (typeof getLang==='function') ? getLang() : 'es';
  if(!window.EJERCICIOS_DATA || !window.EJERCICIOS_DATA.grupos) return fallback || '';
  var found = null;
  if(id){
    window.EJERCICIOS_DATA.grupos.forEach(function(g){
      (g.ejercicios||[]).forEach(function(e){ if(e.id===id) found=e; });
    });
  }
  if(!found && fallback){
    var fl = (''+fallback).trim().toLowerCase();
    window.EJERCICIOS_DATA.grupos.forEach(function(g){
      (g.ejercicios||[]).forEach(function(e){
        if(!found && e.es && (''+e.es).trim().toLowerCase()===fl) found=e;
      });
    });
  }
  if(found) return found[lang] || found.en || found.es || fallback || '';
  return fallback || '';
}

function armarPrep(mes){
  var roster = (window.PLANTEL_NAFELS && window.PLANTEL_NAFELS.jugadores) || [];
  var jugs = roster.map(function(j){
    var r = RUTINAS_RAW[j.num] && RUTINAS_RAW[j.num][mes];
    return { num:j.num, nombre:(j.ap||j.nombre||('#'+j.num)), pos:j.pos||'', semanas:(r&&r.semanas)?r.semanas:[] };
  }).filter(function(j){ return j.semanas.length; });   // solo los que tienen rutina ese mes
  PREP_DATA_LOCAL = { jugadores: jugs };
  JUG_SEL = null;   // reinicia selección (todos visibles) al cambiar de mes/datos
}

// ── Selector de jugadores a mostrar ───────────────────────────────
var JUG_SEL = null;   // null => todos; si no, {num:true/false}
function pintarJugSelector(){
  var cont = document.getElementById('jug-chips');
  if(!cont) return;
  var jugs = (PREP_DATA_LOCAL && PREP_DATA_LOCAL.jugadores) || [];
  var resumen = document.getElementById('jug-resumen');
  if(!jugs.length){
    cont.innerHTML = '<span style="font-size:11px;color:var(--mut)">— sin jugadores con rutina este mes —</span>';
    if(resumen) resumen.textContent = 'Sin jugadores';
    return;
  }
  if(!JUG_SEL){ JUG_SEL = {}; jugs.forEach(function(j){ JUG_SEL[j.num] = true; }); }
  jugs.forEach(function(j){ if(!(j.num in JUG_SEL)) JUG_SEL[j.num] = true; });

  cont.innerHTML = jugs.map(function(j){
    var on = JUG_SEL[j.num] !== false;
    return '<label style="display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:8px;cursor:pointer;font-size:13px">'+
           '<input type="checkbox"'+(on?' checked':'')+' onchange="toggleJug('+j.num+')" style="cursor:pointer">'+
           '<span style="color:var(--mut);font-size:11px;min-width:26px">#'+j.num+'</span>'+
           '<span style="'+(on?'color:#4ade80;font-weight:700':'color:var(--mut)')+'">'+j.nombre+'</span></label>';
  }).join('');

  /* El boton dice cuantos hay elegidos, para no tener que abrirlo. */
  if(resumen){
    var n = jugs.filter(function(j){ return JUG_SEL[j.num] !== false; }).length;
    resumen.textContent = (n === jugs.length) ? 'Todos'
                        : (n === 0) ? 'Ninguno'
                        : (n === 1) ? (jugs.filter(function(j){ return JUG_SEL[j.num] !== false; })[0].nombre)
                        : (n + ' de ' + jugs.length);
  }
}
function toggleJug(num){ JUG_SEL[num] = (JUG_SEL[num] === false); pintarJugSelector(); renderPizarron(); }
function jugTodos(v){
  var jugs = (PREP_DATA_LOCAL && PREP_DATA_LOCAL.jugadores) || [];
  JUG_SEL = {}; jugs.forEach(function(j){ JUG_SEL[j.num] = v; });
  pintarJugSelector(); renderPizarron();
}
/* El panel se abre con el boton y se cierra al tocar afuera. */
function abrirJugs(ev){
  if(ev) ev.stopPropagation();
  var p = document.getElementById('jug-panel');
  if(p) p.style.display = (p.style.display === 'none' || !p.style.display) ? 'block' : 'none';
}
document.addEventListener('click', function(ev){
  var p = document.getElementById('jug-panel'), b = document.getElementById('jug-boton');
  if(!p || p.style.display === 'none') return;
  if(!p.contains(ev.target) && ev.target !== b && !(b && b.contains(ev.target))) p.style.display = 'none';
});
function poblarMeses(){
  var set={};
  Object.keys(RUTINAS_RAW).forEach(function(num){
    var byMes=RUTINAS_RAW[num];
    if(byMes && typeof byMes==='object') Object.keys(byMes).forEach(function(m){
      if(byMes[m] && byMes[m].semanas && byMes[m].semanas.length) set[m]=1;
    });
  });
  var meses=Object.keys(set).sort().reverse();
  if(!meses.length){ usarFallback(); return; }
  var sel=document.getElementById('sel-mes');
  sel.innerHTML = meses.map(function(m){ return '<option value="'+m+'">'+mesLabelFromKey(m)+'</option>'; }).join('');
  document.getElementById('mes-wrap').style.display='';
  MES_ACTUAL=meses[0]; sel.value=MES_ACTUAL;
  armarPrep(MES_ACTUAL); pintarJugSelector(); poblarDias();
}
/* Al cambiar de idioma hay que volver a dibujar: los nombres de ejercicio no
   son texto de la pagina, se resuelven contra el catalogo al pintarlos. */
window.addEventListener('langchange', function(){
  try{ if(typeof renderPizarron==='function') renderPizarron(); }catch(e){}
});

function onMesChange(){ MES_ACTUAL=document.getElementById('sel-mes').value; armarPrep(MES_ACTUAL); pintarJugSelector(); poblarDias(); }
function usarFallback(){
  document.getElementById('mes-wrap').style.display='none';
  PREP_DATA_LOCAL = window.PREP_DATA || null;   // datos viejos si existieran
  pintarJugSelector(); poblarDias();
}
function cargarEquipo(){
  if(typeof fbGet !== 'undefined'){
    fbGet('prep_rutinas', function(data){
      RUTINAS_RAW = (data && typeof data==='object') ? data : {};
      if(Object.keys(RUTINAS_RAW).length) poblarMeses();
      else usarFallback();
    });
  } else {
    // sin Firebase: intentar localStorage (rutinas guardadas en este dispositivo)
    RUTINAS_RAW = {};
    var roster=(window.PLANTEL_NAFELS&&window.PLANTEL_NAFELS.jugadores)||[];
    try{
      roster.forEach(function(j){ var pre='prep_rutina_'+j.num+'_';
        for(var i=0;i<localStorage.length;i++){ var key=localStorage.key(i);
          if(key&&key.indexOf(pre)===0){ (RUTINAS_RAW[j.num]=RUTINAS_RAW[j.num]||{})[key.slice(pre.length)]=JSON.parse(localStorage.getItem(key)); } } });
    }catch(e){}
    if(Object.keys(RUTINAS_RAW).length) poblarMeses(); else usarFallback();
  }
}

// ── Construir mapa de días únicos ─────────────────────────────────
function getDias(){
  if(!PREP_DATA_LOCAL) return [];
  var dias = {};
  PREP_DATA_LOCAL.jugadores.forEach(function(j){
    (j.semanas||[]).forEach(function(s){
      if(!dias[s.label]) dias[s.label] = {label:s.label, bloques:{}};
      (s.bloques||[]).forEach(function(b){
        if(!dias[s.label].bloques[b.nombre]){
          dias[s.label].bloques[b.nombre] = {
            nombre:b.nombre, icon:b.icon, color:b.color, ejercicios:{}
          };
        }
        (b.ejercicios||[]).forEach(function(e){
          if(!dias[s.label].bloques[b.nombre].ejercicios[e.id]){
            dias[s.label].bloques[b.nombre].ejercicios[e.id] = {
              id:e.id, nombre:e.nombre, series:e.series,
              reps:e.reps, descanso:e.descanso, carga:e.carga, video:e.video
            };
          }
        });
      });
    });
  });
  return Object.values(dias);
}

// ── Poblar selector de días ───────────────────────────────────────
function poblarDias(){
  var dias = getDias();
  var sel = document.getElementById('sel-dia');
  sel.innerHTML = '<option value="">— Elegí el día —</option>';
  dias.forEach(function(d){
    var o = document.createElement('option');
    o.value = d.label;              /* el valor queda en castellano: identifica al dia */
    o.textContent = diaTexto(d.label);  /* lo que se ve, traducido */
    sel.appendChild(o);
  });
  // Auto-seleccionar primero
  if(dias.length > 0){
    sel.value = dias[0].label;
    renderPizarron();
  }
}

// ── Storage key ───────────────────────────────────────────────────
function sk(jugNum, ejId, serie){ return 'prep_'+jugNum+'_'+ejId+'_s'+serie; }
function fbSk(jugNum, ejId, serie){ return 'pesos/prep_'+jugNum+'_'+ejId+'_s'+serie; }

// ── Render principal ──────────────────────────────────────────────
function renderPizarron(){
  var diaLabel = document.getElementById('sel-dia').value;
  var cont = document.getElementById('main-content');

  if(!diaLabel || !PREP_DATA_LOCAL){
    cont.innerHTML = '<div class="empty"><div class="empty-icon">🏋️</div><div class="empty-txt">Elegí el día de rutina</div><div class="empty-sub">Seleccioná el día arriba para ver la rutina completa</div></div>';
    return;
  }

  // Filtrar por jugadores elegidos
  var jugadores = PREP_DATA_LOCAL.jugadores.filter(function(j){
    return !JUG_SEL || JUG_SEL[j.num] !== false;
  });

  // Recolectar bloques y ejercicios del día
  var bloques = {};
  jugadores.forEach(function(j){
    (j.semanas||[]).forEach(function(s){
      if(s.label !== diaLabel) return;
      (s.bloques||[]).forEach(function(b){
        if(!bloques[b.nombre]) bloques[b.nombre]={nombre:b.nombre,icon:b.icon,color:b.color,ejercicios:{}};
        (b.ejercicios||[]).forEach(function(e){
          if(!bloques[b.nombre].ejercicios[e.id])
            bloques[b.nombre].ejercicios[e.id]={id:e.id,nombre:e.nombre,series:e.series,reps:e.reps,descanso:e.descanso,carga:e.carga,video:e.video};
        });
      });
    });
  });

  if(Object.keys(bloques).length === 0){
    cont.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-txt">Sin rutina para este día</div><div class="empty-sub">Este día no tiene ejercicios cargados aún</div></div>';
    return;
  }

  cont.innerHTML = '';

  // Título del día
  var titulo = document.createElement('div');
  titulo.className = 'dia-titulo';
  titulo.textContent = '📅 ' + diaTexto(diaLabel);
  cont.appendChild(titulo);

  // Render por bloque
  Object.values(bloques).forEach(function(bloque, bi){
    var bDiv = document.createElement('div');
    bDiv.className = 'bloque';

    var bHdr = document.createElement('div');
    bHdr.className = 'bloque-header';
    bHdr.innerHTML = '<span class="bloque-icon">' + (bloque.icon||'💪') + '</span>' +
      '<span class="bloque-nombre" style="color:' + (bloque.color||'#fff') + '">' + bloqueNombre(bloque.nombre) + '</span>';
    bDiv.appendChild(bHdr);

    // Render por ejercicio
    Object.values(bloque.ejercicios).forEach(function(ej, ei){
      var ejWrap = document.createElement('div');
      ejWrap.className = 'ejercicio-wrap';

      // Título ejercicio
      var tieneVideo = ej.video && ej.video !== 'null' && ej.video !== '';
      var ejTit = document.createElement('div');
      ejTit.className = 'ejercicio-titulo';
      ejTit.innerHTML =
        '<div class="ej-num">' + (ei+1) + '</div>' +
        '<div class="ej-nombre">' + ejNombre(ej.id, ej.nombre) + '</div>' +
        '<div class="ej-badges">' +
          '<span class="ej-badge badge-s">' + ej.series + ' SERIES</span>' +
          '<span class="ej-badge badge-r">' + ej.reps + ' REPS</span>' +
          (ej.descanso ? '<span class="ej-badge badge-d">⏱ ' + ej.descanso + '</span>' : '') +
          (ej.carga ? '<span class="ej-badge badge-c">🏋 ' + ej.carga + '</span>' : '') +
        '</div>' +
        (tieneVideo ? '<button class="ej-video-btn" onclick="window.open(\''+ej.video+'\',\'_blank\')" type="button">🎬 VIDEO</button>' : '<button class="ej-video-btn off" disabled>🎬 VIDEO</button>');
      ejWrap.appendChild(ejTit);

      // Tabla de jugadores
      var tabla = document.createElement('table');
      tabla.className = 'tabla-jugadores';
      var thead = '<thead><tr><th>#</th><th>Jugador</th><th>Posición</th>';
      for(var s=1; s<=ej.series; s++) thead += '<th class="center">SERIE '+s+'</th>';
      thead += '</tr></thead>';
      tabla.innerHTML = thead;

      var tbody = document.createElement('tbody');

      jugadores.forEach(function(j){
        // Verificar que este jugador tiene este ejercicio en este día
        var tieneEj = false;
        (j.semanas||[]).forEach(function(sem){
          if(sem.label !== diaLabel) return;
          (sem.bloques||[]).forEach(function(b){
            (b.ejercicios||[]).forEach(function(e){
              if(e.id === ej.id) tieneEj = true;
            });
          });
        });
        if(!tieneEj) return;

        var tr = document.createElement('tr');
        var posClass = 'pos-' + (j.pos||'');

        var tdNum = document.createElement('td');
        tdNum.className = 'jug-num';
        tdNum.textContent = '#' + j.num;

        var tdNom = document.createElement('td');
        tdNom.className = 'jug-nombre';
        tdNom.textContent = j.nombre;

        var tdPos = document.createElement('td');
        tdPos.innerHTML = '<span class="jug-pos ' + posClass + '">' + (j.pos||'') + '</span>';

        tr.appendChild(tdNum);
        tr.appendChild(tdNom);
        tr.appendChild(tdPos);

        // Series editables
        for(var serie=1; serie<=ej.series; serie++){
          var td = document.createElement('td');
          td.className = 'peso-cell';
          var storKey = sk(j.num, ej.id, serie);
          var saved = localStorage.getItem(storKey) || '';

          var inp = document.createElement('input');
          inp.type = 'number';
          inp.className = 'peso-inp' + (saved ? ' filled' : '');
          inp.placeholder = '—';
          inp.value = saved;
          inp.min = 0; inp.max = 500; inp.step = 0.5;

          // Cargar desde Firebase
          if(typeof fbGet !== 'undefined'){
            (function(k, input){
              fbGet('pesos/'+k, function(val){
                if(val !== null && val !== ''){
                  input.value = val;
                  input.classList.add('filled');
                  localStorage.setItem(k, val);
                }
              });
            })(storKey, inp);
          }

          inp.addEventListener('input', (function(k, input){
            return function(){
              var v = this.value;
              localStorage.setItem(k, v);
              input.classList.toggle('filled', v !== '');
              if(typeof fbSet !== 'undefined') fbSet('pesos/'+k, v);
              updateLastUpdate();
            };
          })(storKey, inp));

          td.appendChild(inp);
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      });

      tabla.appendChild(tbody);
      ejWrap.appendChild(tabla);
      bDiv.appendChild(ejWrap);
    });

    cont.appendChild(bDiv);
  });

  updateLastUpdate();
}

function updateLastUpdate(){
  var d = new Date();
  var h = String(d.getHours()).padStart(2,'0');
  var m = String(d.getMinutes()).padStart(2,'0');
  document.getElementById('last-update').textContent = 'Actualizado ' + h + ':' + m;
}

// ── Fullscreen ────────────────────────────────────────────────────
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(function(){});
    document.body.classList.add('fullscreen');
  } else {
    document.exitFullscreen();
    document.body.classList.remove('fullscreen');
  }
}
document.addEventListener('fullscreenchange', function(){
  if(!document.fullscreenElement) document.body.classList.remove('fullscreen');
});

// ── Escuchar cambios de Firebase en tiempo real ───────────────────
function listenFirebase(){
  if(typeof fbGet === 'undefined') return;
  // Re-cargar pesos cada 30 segundos
  setInterval(function(){
    var inputs = document.querySelectorAll('.peso-inp');
    inputs.forEach(function(inp){
      // Ya tienen listeners individuales — solo re-render si hay cambios
    });
  }, 30000);
}

// ── Init ──────────────────────────────────────────────────────────
window.addEventListener('load', function(){
  setTimeout(function(){
    EQUIPO_DATA_LOCAL = window.EQUIPO_DATA || null;
    cargarEquipo();        // arma el pizarrón desde las rutinas de la nube (por mes)
    listenFirebase();
  }, 200);
});
</script>
