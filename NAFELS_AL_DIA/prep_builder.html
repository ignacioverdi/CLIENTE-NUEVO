<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#080a12;--card:#0e1019;--card2:#13162a;--elev:#171a30;--border:rgba(255,255,255,.07);--b2:rgba(255,255,255,.14);
    --red:#ef2740;--redd:#c01528;--green:#22c55e;--amber:#f59e0b;--indigo:#818cf8;--teal:#2dd4bf;--mut:#5b6680;--mut2:#9aa6c0;--txt:#e7ecf5}
  body{background:radial-gradient(900px 500px at 0% -8%,rgba(239,39,64,.08),transparent 55%),var(--bg);
    font-family:'Barlow Condensed',sans-serif;color:var(--txt);min-height:100vh;padding-bottom:100px}
  select,input,textarea{font-family:'Barlow Condensed',sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px}
  .header{display:flex;align-items:center;gap:14px;padding:16px 0 6px;flex-wrap:wrap}
  .back-btn{color:var(--mut2);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    border:1px solid var(--border);padding:7px 13px;border-radius:9px;white-space:nowrap}
  .back-btn:hover{color:var(--txt)}
  .subtitle{font-size:11px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
  h1{font-family:'Bebas Neue',sans-serif;font-size:27px;letter-spacing:3px}
  .badge{background:rgba(239,39,64,.14);border:1px solid rgba(239,39,64,.34);color:#ff5870;padding:4px 12px;border-radius:20px;
    font-size:11px;font-weight:700;letter-spacing:1px;margin-left:auto;white-space:nowrap}
  .topline{height:3px;background:linear-gradient(90deg,var(--red),transparent);border-radius:3px;margin:2px 0 16px}
  .card{background:linear-gradient(180deg,var(--elev),var(--card));border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
  label.fld{display:block;font-size:10px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
  select,input[type=text],input[type=number]{width:100%;background:#fff;color:#111;border:1px solid var(--b2);border-radius:9px;
    padding:9px 11px;font-size:14px;font-weight:600;outline:none}
  .ctrl-grid{display:grid;grid-template-columns:2fr 1.4fr auto;gap:10px;align-items:end}
  .btn{padding:10px 16px;border:none;border-radius:10px;font-family:'Bebas Neue';font-size:15px;letter-spacing:2px;cursor:pointer;white-space:nowrap}
  .btn-red{background:linear-gradient(135deg,var(--red),var(--redd));color:#fff}
  .btn-ghost{background:rgba(255,255,255,.05);color:var(--mut2);border:1px solid var(--border)!important}
  .btn-ghost:hover{color:var(--txt)}
  .btn-teal{background:linear-gradient(135deg,var(--teal),#14b8a6);color:#06231d}
  .btn-sm{font-size:12px;letter-spacing:1px;padding:6px 11px;border-radius:8px}
  .chip{border-color:rgba(45,212,191,.45)!important;color:#2dd4bf!important;font-family:'Barlow Condensed',sans-serif;font-weight:700}
  .chip:hover{background:rgba(45,212,191,.14)!important;color:#5eead4!important}
  .fb-card{border:1px solid rgba(45,212,191,.22);background:linear-gradient(180deg,rgba(45,212,191,.05),var(--card))}
  .fb-head{font-size:15px;font-weight:800;font-family:'Barlow Condensed',sans-serif;letter-spacing:.4px;color:var(--txt);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
  .fb-badge{font-size:11px;font-weight:700;letter-spacing:.3px;padding:4px 10px;border-radius:999px;font-family:'Inter',sans-serif}
  .fb-ok{background:rgba(34,197,94,.13);color:#22c55e;border:1px solid rgba(34,197,94,.25)}
  .fb-warn{background:rgba(245,158,11,.13);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}
  .fb-tag{font-weight:700;color:var(--mut2,#9aa6c0)}
  .fb-well{font-size:12.5px;color:var(--txt);background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.16);border-radius:9px;padding:8px 11px;margin-bottom:8px;line-height:1.5}
  .fb-nota{font-size:13px;color:#fbbf24;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.16);border-radius:9px;padding:9px 12px;margin-bottom:10px;line-height:1.55}
  .fb-list{display:flex;flex-direction:column;gap:8px}
  .fb-ej{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
  .fb-ej-nom{font-size:13px;font-weight:700;color:var(--txt);font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fb-rm{font-size:11px;font-weight:700;color:#2dd4bf;background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.22);border-radius:7px;padding:2px 8px;font-family:'Inter',sans-serif}
  .fb-ej-pesos{display:flex;flex-wrap:wrap;gap:6px}
  .fb-serie{font-size:12px;color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:7px;padding:3px 9px;font-weight:600}
  .fb-na{font-size:12px;color:var(--mut)}
  .fb-obs{font-size:12.5px;color:#cbd5e1;margin-top:7px;line-height:1.5;font-style:italic}
  .fb-empty{font-size:12.5px;color:var(--mut);text-align:center;padding:6px}
  .trad-btn{font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--teal);background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.28);border-radius:7px;padding:3px 9px;cursor:pointer;font-family:'Inter',sans-serif;vertical-align:middle}
  .trad-btn:hover{background:rgba(45,212,191,.18)}
  .fb-reply{margin:4px 0 12px;padding:11px 12px;background:rgba(45,212,191,.05);border:1px solid rgba(45,212,191,.16);border-radius:11px}
  .fb-reply-lbl{font-size:10px;color:var(--teal);letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .fb-reply-txt{width:100%;min-height:58px;resize:vertical;background:#fff;color:#111;border:1px solid var(--b2);border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:'Inter',sans-serif;line-height:1.5;outline:none;box-sizing:border-box}
  .fb-reply-status{font-size:11px;color:var(--teal);margin-top:6px;min-height:13px}
  .cp-ov{position:fixed;inset:0;z-index:99995;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
  .cp-ov.on{display:flex}
  .cp-box{background:#0e1018;border:1px solid var(--border);border-radius:16px;max-width:480px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
  .cp-box h3{font-family:'Bebas Neue';letter-spacing:2px;font-size:23px;margin:0 0 4px}
  .cp-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .cp-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.03);cursor:pointer;font-size:13px;user-select:none}
  .cp-item input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer}
  .cp-item.sel{border-color:var(--teal);background:rgba(45,212,191,.12)}
  .cp-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .ses{border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;background:var(--card)}
  .ses-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,var(--elev),var(--card))}
  .ses-hd input{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--border);font-family:'Bebas Neue';font-size:18px;letter-spacing:1px}
  .ses-bd{padding:12px;background:rgba(6,7,13,.4)}
  .blo{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .blo-hd{display:flex;align-items:center;gap:8px;padding:9px 12px}
  .blo-hd select{max-width:230px;background:var(--card2);color:var(--txt);border-color:var(--border)}
  .blo-ic{font-size:17px}
  .ej-row{display:grid;grid-template-columns:1fr 56px 62px 78px 68px 1fr auto;gap:7px;align-items:center;padding:7px 12px;border-top:1px solid var(--border)}
  .ej-row select,.ej-row input{background:var(--card2);color:var(--txt);border-color:var(--border);font-size:13px;padding:7px 8px}
  .ej-row .vbtn{color:var(--indigo);font-size:11px;text-decoration:none;white-space:nowrap}
  .ej-combo{display:flex;align-items:center;gap:7px;padding:0 12px 8px 30px}
  .ej-combo .cmb-plus{color:var(--indigo);font-weight:800;font-size:15px;flex-shrink:0}
  .ej-combo select{flex:1;min-width:0;background:var(--card2);color:var(--txt);border-color:var(--border);font-size:13px;padding:7px 8px}
  .ej-combo input{width:62px;background:var(--card2);color:var(--txt);border-color:var(--border);font-size:13px;padding:7px 8px}
  .ej-combo .vbtn{color:var(--indigo);font-size:11px;text-decoration:none;white-space:nowrap}
  .btn-combinar{background:none;border:none;color:var(--indigo);font-size:11px;cursor:pointer;white-space:nowrap;padding:2px 4px}
  .btn-combinar:hover{text-decoration:underline}
  .x{background:none;border:none;color:var(--mut);font-size:17px;cursor:pointer;padding:2px 6px}
  .x:hover{color:var(--red)}
  .addrow{display:flex;gap:8px;padding:9px 12px;flex-wrap:wrap}
  .hint{font-size:11px;color:var(--mut);line-height:1.6}
  .savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(8,10,18,.94);backdrop-filter:blur(16px);border-top:1px solid var(--border);
    padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:center;z-index:50}
  .savebar .st{font-size:12px;color:var(--mut2)}
  .empty{color:var(--mut);text-align:center;padding:30px;font-size:14px}
  .colhdr{display:grid;grid-template-columns:1fr 56px 62px 78px 68px 1fr auto;gap:7px;padding:2px 12px 4px;font-size:9px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
  @media(max-width:640px){.ctrl-grid{grid-template-columns:1fr}.ej-row,.colhdr{grid-template-columns:1fr 1fr;}.ej-row .vbtn{grid-column:1/-1}}
</style></head>
<body>
<div class="wrap">
  <div class="header">
    <a href="prep_fisica.html" class="back-btn">← Prep Física</a>
    <div><div class="subtitle">Axpo Volley Näfels · Cuerpo técnico</div><h1>ARMAR RUTINAS</h1></div>
    <div class="badge">Preparador físico</div>
  </div>
  <div class="topline"></div>

  <div class="card">
    <div class="ctrl-grid">
      <div><label class="fld">Jugador</label><select id="selJug" onchange="onPick()"></select></div>
      <div><label class="fld">Mes de uso</label><select id="selMes" onchange="onPick()"></select></div>
      <button class="btn btn-ghost" onclick="onPick()">Cargar</button>
    </div>
    <div class="hint" style="margin-top:10px" id="estado">Elegí jugador y mes. Si ya hay una rutina cargada para ese mes, se abre para editar; si no, empezás una nueva.</div>
    <div id="saved-chips" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center"></div>
  </div>

  <div id="feedback-jugador"></div>

  <div id="editor"></div>

  <div class="card" style="text-align:center">
    <button class="btn btn-ghost" onclick="addSesion()">+ Agregar día / sesión</button>
  </div>
</div>

<div class="cp-ov" id="cpOv">
  <div class="cp-box">
    <h3 id="cpTitle">📋 Copiar rutina a…</h3>
    <div class="hint" id="cpHint">Se copiará la rutina actual a los jugadores que elijas.</div>
    <div style="text-align:right;margin-top:12px"><button class="btn btn-ghost btn-sm" id="cpAllBtn" onclick="cpToggleAll()">Seleccionar todos</button></div>
    <div class="cp-list" id="cpList"></div>
    <div class="cp-actions">
      <button class="btn btn-ghost" onclick="cpClose()">Cancelar</button>
      <button class="btn btn-teal" id="cpConfirmBtn" onclick="cpConfirm()">Copiar</button>
    </div>
  </div>
</div>

<div class="savebar">
  <span class="st" id="savest">—</span>
  <button class="btn btn-ghost" onclick="cpOpen('copiar')">📋 COPIAR A…</button>
  <button class="btn btn-ghost" onclick="cpOpen('vaciar')">🧹 VACIAR EN…</button>
  <button class="btn btn-teal" onclick="guardar()">💾 GUARDAR RUTINA</button>
</div>

<script>
var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var BLOQUES=[
  {nombre:'ENTRADA EN CALOR',icon:'🔥',color:'#f97316'},
  {nombre:'ACTIVACIÓN',icon:'⚡',color:'#eab308'},
  {nombre:'FUERZA INFERIOR',icon:'🦵',color:'#ef2740'},
  {nombre:'FUERZA SUPERIOR',icon:'💪',color:'#3b82f6'},
  {nombre:'POTENCIA',icon:'🚀',color:'#f59e0b'},
  {nombre:'PLIOMETRÍA',icon:'🤸',color:'#a855f7'},
  {nombre:'CORE',icon:'🎯',color:'#22c55e'},
  {nombre:'PREVENTIVOS',icon:'🛡️',color:'#06b6d4'},
  {nombre:'MOVILIDAD',icon:'🧘',color:'#2dd4bf'}
];
function roster(){ return (window.PLANTEL_NAFELS&&window.PLANTEL_NAFELS.jugadores)||[]; }
function catalogo(){ return (window.EJERCICIOS_DATA&&window.EJERCICIOS_DATA.grupos)||[]; }
function pname(j){ return '#'+j.num+'  '+(j.ap||j.nombre); }
function ejById(id){ var g=catalogo(); for(var i=0;i<g.length;i++){var e=g[i].ejercicios.find(function(x){return x.id===id;});if(e)return e;} return null; }
function bloqueByName(n){ return BLOQUES.find(function(b){return b.nombre===n;})||BLOQUES[2]; }

var R = null;   // rutina en edición: {mes, mesLabel, semanas:[{id,label,bloques:[{nombre,icon,color,ejercicios:[{id,nombre,series,reps,descanso,nota,video}]}]}]}
var DIRTY=false;
function setDirty(d){ DIRTY=d; document.getElementById('savest').textContent = d?'Cambios sin guardar':'Guardado'; }

/* ---------- init selects ---------- */
(function init(){
  var sj=document.getElementById('selJug');
  sj.innerHTML = roster().length ? roster().map(function(j){return '<option value="'+j.num+'">'+pname(j)+'</option>';}).join('')
                                 : '<option value="">(no se cargó el plantel)</option>';
  var sm=document.getElementById('selMes'), now=new Date(), opts='';
  for(var d=-11; d<=4; d++){                          // hasta 11 meses atras + actual + 4 siguientes
    var dt=new Date(now.getFullYear(), now.getMonth()+d, 1);
    var key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
    var lbl=MESES[dt.getMonth()]+' '+dt.getFullYear();
    opts+='<option value="'+key+'" data-lbl="'+lbl+'"'+(d===0?' selected':'')+'>'+lbl+'</option>';
  }
  sm.innerHTML=opts;
  cargar();
})();

/* ---------- cargar rutina (Firebase) ---------- */
function nuevaRutina(){
  var sm=document.getElementById('selMes'), opt=sm.options[sm.selectedIndex];
  return { mes: sm.value, mesLabel: opt?opt.getAttribute('data-lbl'):sm.value, semanas: [] };
}
var loadedNum=null, loadedMes=null;
function onPick(){
  if(DIRTY && !confirm('Tenés cambios sin guardar.\n¿Descartarlos y cargar la otra rutina?')){
    if(loadedNum!=null) document.getElementById('selJug').value=loadedNum;
    if(loadedMes!=null) document.getElementById('selMes').value=loadedMes;
    return;
  }
  cargar();
}
function normMes(k){ var p=String(k).split('-'); return p[0]+'-'+String(parseInt(p[1]||'0',10)); }
function cargar(){
  var num=+document.getElementById('selJug').value, mes=document.getElementById('selMes').value;
  loadedNum=document.getElementById('selJug').value; loadedMes=mes;
  refreshSavedChips();
  if(!num){ R=nuevaRutina(); render(); return; }
  document.getElementById('estado').textContent='Buscando rutina guardada…';
  var target=normMes(mes);
  function scoreRut(r){ return rutinaTieneEjercicios(r) ? 2 : ((r && r.semanas && r.semanas.length) ? 1 : 0); }
  function pick(obj){
    if(!obj || typeof obj!=='object' || obj.error) return null;
    var cands=[];
    Object.keys(obj).forEach(function(k){ if(normMes(k)===target && obj[k] && obj[k].semanas) cands.push({r:obj[k], k:k}); });  // todas las del mes (cualquier formato)
    if(!cands.length) return null;
    cands.sort(function(a,b){ return scoreRut(b.r)-scoreRut(a.r); });  // primero la que tenga EJERCICIOS, no la vacía
    return cands[0];
  }
  // copia local: todas las variantes de mes de este jugador en este dispositivo
  var localObj={};
  try{ var pre='prep_rutina_'+num+'_'; for(var i=0;i<localStorage.length;i++){ var lk=localStorage.key(i); if(lk && lk.indexOf(pre)===0){ try{ localObj[lk.substring(pre.length)]=JSON.parse(localStorage.getItem(lk)); }catch(e){} } } }catch(e){}
  function aplicar(found){
    if(found && found.r && found.r.semanas){ R=normalizarRutina(found.r); R.mes=found.k; R.mesLabel=mesLabelFromKey(found.k);
      document.getElementById('estado').textContent = rutinaTieneEjercicios(R) ? ('✓ Rutina de '+R.mesLabel+' cargada — editá lo que quieras.') : ('Este jugador no tiene ejercicios cargados en '+R.mesLabel+'. Agregá días/ejercicios o elegí otro jugador.'); }
    else { R=nuevaRutina(); document.getElementById('estado').textContent='No había rutina para ese mes. Empezás una nueva.'; }
    render(); setDirty(false); renderFeedback(num, R.mes);
  }
  if(typeof fbGet!=='undefined'){ fbGet('prep_rutinas/'+num, function(all){ aplicar( pick(all) || pick(localObj) ); }); }
  else { aplicar( pick(localObj) ); }
}

/* ---------- chips de meses con rutina guardada (para no adivinar el mes) ---------- */
function mesLabelFromKey(mes){ var p=String(mes).split('-'); var y=+p[0], mo=(+p[1])-1; return (MESES[mo]||mes)+' '+y; }
function rutinaTieneEjercicios(r){
  if(!r || !r.semanas || !r.semanas.length) return false;
  for(var i=0;i<r.semanas.length;i++){ var bs=r.semanas[i].bloques||[]; for(var j=0;j<bs.length;j++){ if((bs[j].ejercicios||[]).length) return true; } }
  return false;
}
function normalizarRutina(r){
  // Firebase borra los arrays vacíos: hay que reponerlos para que el editor no explote
  if(!r || typeof r!=='object') return r;
  if(!Array.isArray(r.semanas)) r.semanas = [];
  r.semanas.forEach(function(s){
    if(!Array.isArray(s.bloques)) s.bloques = [];
    s.bloques.forEach(function(b){ if(!Array.isArray(b.ejercicios)) b.ejercicios = []; });
  });
  return r;
}
function listSavedMonths(num, cb){
  var found={};
  try{
    var pref='prep_rutina_'+num+'_';
    for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k && k.indexOf(pref)===0){ var mz=k.substring(pref.length); if(/^\d{4}-\d{2}$/.test(mz)){ try{ var r=JSON.parse(localStorage.getItem(k)||'null'); if(rutinaTieneEjercicios(r)) found[mz]=true; }catch(e){} } } }
  }catch(e){}
  if(typeof fbGet!=='undefined'){
    fbGet('prep_rutinas/'+num, function(data){
      if(data && typeof data==='object' && !data.error){ Object.keys(data).forEach(function(mz){ if(rutinaTieneEjercicios(data[mz])) found[mz]=true; }); }
      cb(Object.keys(found));
    });
  } else { cb(Object.keys(found)); }
}
function refreshSavedChips(){
  var box=document.getElementById('saved-chips'); if(!box) return;
  var num=+document.getElementById('selJug').value;
  if(!num){ box.innerHTML=''; return; }
  listSavedMonths(num, function(meses){
    if(!meses.length){ box.innerHTML='<span class="hint">Este jugador todavía no tiene rutinas guardadas.</span>'; return; }
    meses.sort().reverse();
    box.innerHTML='<span class="hint" style="margin-right:4px">📋 Tiene rutinas en:</span>'+
      meses.map(function(m){ return '<button type="button" class="btn btn-ghost btn-sm chip" onclick="abrirMes(\''+m+'\')">'+mesLabelFromKey(m)+'</button>'; }).join(' ');
  });
}
function abrirMes(mes){
  if(DIRTY && !confirm('Tenés cambios sin guardar.\n¿Descartarlos y abrir esa rutina?')) return;
  var sm=document.getElementById('selMes');
  if(!Array.prototype.some.call(sm.options,function(o){return o.value===mes;})){
    var o=document.createElement('option'); o.value=mes; o.setAttribute('data-lbl',mesLabelFromKey(mes)); o.textContent=mesLabelFromKey(mes); sm.appendChild(o);
  }
  sm.value=mes; cargar();
}

/* ---------- traducción (servicio gratuito; sl=auto detecta el idioma de origen) ---------- */
function traducirTexto(texto, target, cb){
  if(!texto){ cb(''); return; }
  var t=encodeURIComponent(texto), tl=encodeURIComponent(target);
  fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+tl+'&dt=t&q='+t)
    .then(function(r){ return r.json(); })
    .then(function(d){ var out=(d&&d[0]&&d[0].map)?d[0].map(function(s){return s[0];}).join(''):null; cb(out||null); })
    .catch(function(){ cb(null); });
}
function attachTranslate(btn, txtEl, getTarget){
  if(!btn || !txtEl) return;
  btn.addEventListener('click', function(){
    var orig=txtEl.getAttribute('data-orig'); if(orig==null){ orig=txtEl.textContent; txtEl.setAttribute('data-orig', orig); }
    if(txtEl.getAttribute('data-trad')==='1'){ txtEl.textContent=orig; txtEl.setAttribute('data-trad','0'); btn.textContent='🌐 Traducir'; return; }
    var target=getTarget()||'es'; var self=this; self.textContent='⏳…';
    traducirTexto(orig, target, function(out){
      if(out){ txtEl.textContent=out; txtEl.setAttribute('data-trad','1'); self.textContent='↩ Ver original'; }
      else { self.textContent='🌐 Traducir'; alert('No se pudo traducir en este momento. Probá de nuevo en un ratito.'); }
    });
  });
}
/* ---------- Panel: lo que hizo el jugador (pesos, 1RM, observaciones, wellness, nota) ---------- */
function fbEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderFeedback(num, mes){
  var box=document.getElementById('feedback-jugador');
  if(!box) return;
  if(!num){ box.innerHTML=''; return; }
  if(typeof fbGet==='undefined'){ box.innerHTML='<div class="card fb-card"><div class="fb-empty">Necesitás conexión para ver lo que hizo el jugador.</div></div>'; return; }
  box.innerHTML='<div class="card fb-card"><div class="fb-empty">Cargando lo que hizo el jugador…</div></div>';

  var ejs=[], seen={};
  (R.semanas||[]).forEach(function(s){ (s.bloques||[]).forEach(function(b){ (b.ejercicios||[]).forEach(function(e){ if(e.id && !seen[e.id]){ seen[e.id]=1; ejs.push({id:e.id, nombre:e.nombre||e.id}); } }); }); });

  var D={wellness:null, nota:null, pesos:{}, obs:{}, rm:{}}, pending=5;
  function ready(){ if(--pending<=0) paint(); }
  fbGet('wellness/'+num, function(d){ D.wellness=d; ready(); });
  fbGet('notas/'+num+'/'+mes, function(d){ D.nota=d; ready(); });
  fbGet('pesos', function(d){ if(d&&typeof d==='object'){ var pf='prep_'+num+'_'; Object.keys(d).forEach(function(k){ if(k.indexOf(pf)===0){ var m=k.match(/^prep_\d+_(.+)_s(\d+)$/); if(m){ (D.pesos[m[1]]=D.pesos[m[1]]||{})[+m[2]]=d[k]; } } }); } ready(); });
  fbGet('obs', function(d){ if(d&&typeof d==='object'){ var pf='prep_obs_'+num+'_'; Object.keys(d).forEach(function(k){ if(k.indexOf(pf)===0){ if(d[k]) D.obs[k.substring(pf.length)]=d[k]; } }); } ready(); });
  fbGet('rm', function(d){ if(d&&typeof d==='object'){ var pf='prep_rm_'+num+'_'; Object.keys(d).forEach(function(k){ if(k.indexOf(pf)===0){ if(d[k]) D.rm[k.substring(pf.length)]=d[k]; } }); } ready(); });

  function paint(){
    var sj=document.getElementById('selJug'), o=sj.options[sj.selectedIndex], nombreJug=o?o.textContent:('#'+num);
    var conPeso=ejs.filter(function(e){ return D.pesos[e.id] && Object.keys(D.pesos[e.id]).length; }).length, totalEj=ejs.length;
    var adh = totalEj ? (conPeso>0 ? '<span class="fb-badge fb-ok">✓ Registró pesos en '+conPeso+' de '+totalEj+' ejercicios</span>' : '<span class="fb-badge fb-warn">⚠ Sin registros de esta rutina todavía</span>') : '';

    var wHtml='';
    if(D.wellness && typeof D.wellness==='object'){
      var wk=Object.keys(D.wellness).sort(), w=wk.length?D.wellness[wk[wk.length-1]]:null;
      if(w){
        var q=w.q||{}, pares=[], qmap=[['sueno','😴 Sueño'],['energia','⚡ Energía'],['piernas','🦵 Piernas'],['cuerpo','💪 Cuerpo'],['animo','🙂 Ánimo'],['estres','🧘 Calma']];
        qmap.forEach(function(p){ if(q[p[0]]!=null) pares.push(p[1]+' '+fbEsc(q[p[0]])); });
        if(w.rpe!=null) pares.push('🔥 RPE '+fbEsc(w.rpe));
        var pct=(w.pct!=null)?'<b style="color:#2dd4bf">Readiness '+fbEsc(w.pct)+'%</b>':'', fecha=w.date?fbEsc(w.date):'';
        if(pct||pares.length) wHtml='<div class="fb-well"><span class="fb-tag">🩺 Wellness'+(fecha?' '+fecha:'')+':</span> '+pct+(pct&&pares.length?' · ':'')+pares.join(' · ')+'</div>';
      }
    }
    var notaHtml=(D.nota && String(D.nota).trim()) ? '<div class="fb-nota"><span class="fb-tag">💬 Nota del jugador:</span> <span id="fbNotaTxt">'+fbEsc(D.nota)+'</span> <button type="button" class="trad-btn" id="fbNotaTrad">🌐 Traducir</button></div>' : '';
    var replyVal=''; try{ replyVal=localStorage.getItem('prep_notapf_'+num+'_'+mes)||''; }catch(e){}
    var replyHtml='<div class="fb-reply">'+
        '<div class="fb-reply-lbl">✍️ Responderle al jugador <span style="color:var(--mut);font-weight:400;text-transform:none;letter-spacing:0">(lo ve en su rutina)</span></div>'+
        '<textarea id="pfReplyInput" class="fb-reply-txt" placeholder="Escribile una respuesta o indicación…"></textarea>'+
        '<div class="fb-reply-status" id="pfReplyStatus"></div>'+
      '</div>';

    var filas=ejs.filter(function(e){ return D.pesos[e.id]||D.rm[e.id]||D.obs[e.id]; }).map(function(e){
      var po=D.pesos[e.id]||{}, series=Object.keys(po).map(Number).sort(function(a,b){return a-b;});
      var pesosTxt=series.length ? series.map(function(s){ return '<span class="fb-serie">S'+s+': '+fbEsc(po[s])+'</span>'; }).join('') : '<span class="fb-na">— sin pesos</span>';
      var rmTxt=D.rm[e.id] ? '<span class="fb-rm">1RM '+fbEsc(D.rm[e.id])+' kg</span>' : '';
      var obsTxt=D.obs[e.id] ? '<div class="fb-obs">💬 '+fbEsc(D.obs[e.id])+'</div>' : '';
      return '<div class="fb-ej"><div class="fb-ej-nom">'+fbEsc(e.nombre)+' '+rmTxt+'</div><div class="fb-ej-pesos">'+pesosTxt+'</div>'+obsTxt+'</div>';
    }).join('');
    if(!filas) filas='<div class="fb-empty">El jugador todavía no registró pesos ni observaciones en esta rutina.</div>';

    box.innerHTML='<div class="card fb-card"><div class="fb-head">📊 Lo que hizo '+fbEsc(nombreJug)+' '+adh+'</div>'+wHtml+notaHtml+replyHtml+'<div class="fb-list">'+filas+'</div></div>';

    // traducir la nota del jugador (al español)
    attachTranslate(document.getElementById('fbNotaTrad'), document.getElementById('fbNotaTxt'), function(){ return 'es'; });
    // respuesta del profe (se guarda en notas_pf y la ve el jugador)
    var rin=document.getElementById('pfReplyInput'), rst=document.getElementById('pfReplyStatus'), rtmr=null;
    if(rin){
      rin.value=replyVal;
      rin.addEventListener('input', function(){
        var v=this.value; try{ localStorage.setItem('prep_notapf_'+num+'_'+mes, v); }catch(e){}
        if(rst) rst.textContent='Guardando…';
        clearTimeout(rtmr);
        rtmr=setTimeout(function(){ if(typeof fbSet!=='undefined') fbSet('notas_pf/'+num+'/'+mes, v); if(rst) rst.textContent='✓ El jugador puede verlo'; }, 600);
      });
      if(typeof fbGet!=='undefined'){ fbGet('notas_pf/'+num+'/'+mes, function(d){ if(d!==null && d!==undefined && document.getElementById('pfReplyInput')){ rin.value=d; try{ localStorage.setItem('prep_notapf_'+num+'_'+mes, d); }catch(e){} } }); }
    }
  }
}

/* ---------- guardar (Firebase + local) ---------- */
function guardar(){
  var num=+document.getElementById('selJug').value;
  if(!num){ alert('Elegí un jugador.'); return; }
  if(!R) R=nuevaRutina();
  // limpiar ejercicios sin elegir
  (R.semanas||[]).forEach(function(s){ (s.bloques||[]).forEach(function(b){ b.ejercicios=(b.ejercicios||[]).filter(function(e){return e.id;}); }); });
  var vacia = !rutinaTieneEjercicios(R);
  if(vacia && !confirm('Esta rutina va a quedar SIN ejercicios.\n¿Guardar igual y dejarla limpia? El jugador no verá ejercicios para este mes.')) return;
  R.actualizado = new Date().toISOString();
  var path='prep_rutinas/'+num+'/'+R.mes;
  try{ localStorage.setItem('prep_rutina_'+num+'_'+R.mes, JSON.stringify(R)); }catch(e){}
  if(typeof fbSet!=='undefined'){ fbSet(path, R); document.getElementById('savest').textContent = vacia ? 'Rutina vaciada ✓' : 'Guardado en la nube ✓'; }
  else { document.getElementById('savest').textContent = (vacia?'Rutina vaciada':'Guardado')+' en este dispositivo ✓ (sin conexión a la nube)'; }
  setDirty(false);
  refreshSavedChips();
}
/* ---------- copiar rutina a varios jugadores ---------- */
var cpMode='copiar';
function cpOpen(mode){
  cpMode = (mode==='vaciar') ? 'vaciar' : 'copiar';
  var curNum=+document.getElementById('selJug').value;
  if(!curNum){ alert('Elegí un jugador.'); return; }
  if(cpMode==='copiar' && (!R || !rutinaTieneEjercicios(R))){ alert('Primero armá la rutina (al menos un día con ejercicios).'); return; }
  var mo=document.getElementById('selMes').options[document.getElementById('selMes').selectedIndex], mesLbl=mo?mo.textContent:((R&&R.mesLabel)||'');
  if(cpMode==='vaciar'){
    document.getElementById('cpTitle').textContent='🧹 Vaciar rutina en…';
    document.getElementById('cpHint').textContent='Se vaciará la rutina de '+mesLbl+' en los jugadores que elijas. Ese mes les queda SIN ejercicios.';
    document.getElementById('cpConfirmBtn').textContent='Vaciar';
  } else {
    document.getElementById('cpTitle').textContent='📋 Copiar rutina a…';
    document.getElementById('cpHint').textContent='Se copiará la rutina de '+mesLbl+' a los jugadores que elijas. Después podés ajustarla en cada uno por separado.';
    document.getElementById('cpConfirmBtn').textContent='Copiar';
  }
  var list=document.getElementById('cpList'); list.innerHTML='';
  roster().forEach(function(j){
    if(cpMode==='copiar' && +j.num===curNum) return; // en copiar, el actual ya la tiene (se guarda con GUARDAR)
    var lab=document.createElement('label'); lab.className='cp-item';
    lab.innerHTML='<input type="checkbox" value="'+j.num+'"><span>#'+j.num+' '+(j.ap||j.nombre||'')+'</span>';
    lab.querySelector('input').onchange=function(){ lab.classList.toggle('sel', this.checked); };
    list.appendChild(lab);
  });
  document.getElementById('cpAllBtn').textContent='Seleccionar todos';
  document.getElementById('cpOv').classList.add('on');
}
function cpClose(){ document.getElementById('cpOv').classList.remove('on'); }
function cpToggleAll(){
  var boxes=document.querySelectorAll('#cpList input[type=checkbox]');
  var anyOff=Array.prototype.some.call(boxes, function(b){ return !b.checked; });
  Array.prototype.forEach.call(boxes, function(b){ b.checked=anyOff; b.dispatchEvent(new Event('change')); });
  document.getElementById('cpAllBtn').textContent=anyOff?'Quitar todos':'Seleccionar todos';
}
function cpConfirm(){
  var sel=Array.prototype.map.call(document.querySelectorAll('#cpList input:checked'), function(b){ return +b.value; });
  if(!sel.length){ alert('Elegí al menos un jugador.'); return; }
  if(cpMode==='vaciar'){
    var mes=document.getElementById('selMes').value, target=normMes(mes);
    var mo=document.getElementById('selMes').options[document.getElementById('selMes').selectedIndex], mesLbl=mo?mo.textContent:mes;
    if(!confirm('Vas a VACIAR la rutina de '+mesLbl+' en '+sel.length+' jugador'+(sel.length>1?'es':'')+'.\nEse mes les queda sin ejercicios. ¿Seguro?')) return;
    function clearKey(num, k){
      var vacia={mes:k, mesLabel:mesLabelFromKey(k), semanas:[], actualizado:new Date().toISOString()};
      try{ localStorage.setItem('prep_rutina_'+num+'_'+k, JSON.stringify(vacia)); }catch(e){}
      if(typeof fbSet!=='undefined') fbSet('prep_rutinas/'+num+'/'+k, vacia);
    }
    sel.forEach(function(num){
      if(typeof fbGet!=='undefined'){
        fbGet('prep_rutinas/'+num, function(all){
          var keys=[]; if(all&&typeof all==='object'&&!all.error){ Object.keys(all).forEach(function(k){ if(normMes(k)===target) keys.push(k); }); }
          if(!keys.length) keys.push(mes);
          keys.forEach(function(k){ clearKey(num, k); });
        });
      } else { clearKey(num, mes); clearKey(num, target); }
    });
    cpClose();
    document.getElementById('savest').textContent='Rutina vaciada en '+sel.length+' jugador'+(sel.length>1?'es':'')+' ✓';
    if(sel.indexOf(+document.getElementById('selJug').value)>=0){ setTimeout(cargar, 500); }
    refreshSavedChips();
    return;
  }
  // ---- modo copiar ----
  (R.semanas||[]).forEach(function(s){ (s.bloques||[]).forEach(function(b){ b.ejercicios=(b.ejercicios||[]).filter(function(e){ return e.id; }); }); });
  var copiados=0;
  sel.forEach(function(num){
    var copia=JSON.parse(JSON.stringify(R));
    copia.actualizado=new Date().toISOString();
    var path='prep_rutinas/'+num+'/'+copia.mes;
    try{ localStorage.setItem('prep_rutina_'+num+'_'+copia.mes, JSON.stringify(copia)); }catch(e){}
    if(typeof fbSet!=='undefined'){ fbSet(path, copia); }
    copiados++;
  });
  cpClose();
  document.getElementById('savest').textContent='Rutina copiada a '+copiados+' jugador'+(copiados>1?'es':'')+' ✓';
}
