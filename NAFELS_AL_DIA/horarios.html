<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horarios — Näfels Volley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="datos_seguros.js"></script>
<script src="firebase.js" onerror="void 0"></script>
<script src="lang.js" onerror="void 0"></script>
<style>
  :root{ --bg:#0a0b14; --card:#0d0e1a; --line:rgba(255,255,255,.08); --txt:#e2e8f0; --mut:#64748b; --red:#e8192c; --amber:#f59e0b; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,sans-serif; padding:16px 14px 40px; }
  .wrap{ max-width:640px; margin:0 auto; }
  .head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  h1{ font-family:'Bebas Neue',sans-serif; letter-spacing:2px; font-size:26px; margin:0; flex:1; line-height:1.1; }
  .sub{ color:var(--mut); font-size:12px; margin:0 0 16px; }
  button{ font-family:inherit; cursor:pointer; }
  #editBtn{ background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; white-space:nowrap; }

  /* navegación de semana */
  .wnav{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .wbtn{ background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:10px; width:42px; height:42px; font-size:22px; line-height:1; }
  .wbtn:active{ background:#15172a; }
  .wrange{ flex:1; text-align:center; font-family:'Bebas Neue',sans-serif; letter-spacing:1.5px; font-size:19px; }
  .wtoday{ display:block; margin:0 auto 8px; background:transparent; border:1px solid var(--line); color:var(--mut); border-radius:20px; padding:5px 14px; font-size:12px; }
  .wtag{ text-align:center; font-size:11px; margin-bottom:14px; padding:5px; border-radius:8px; }
  .wtag.base{ color:var(--amber); background:rgba(245,158,11,.08); }
  .wtag.perso{ color:#22c55e; background:rgba(34,197,94,.08); }

  #status{ font-size:12px; color:#22c55e; height:16px; opacity:0; transition:opacity .3s; margin-bottom:6px; text-align:center; }
  .day{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:10px; }
  .day-lbl{ font-family:'Bebas Neue',sans-serif; letter-spacing:2px; font-size:15px; color:var(--mut); margin-bottom:9px; }
  .empty{ color:#3f4860; font-size:13px; font-style:italic; }
  .ses{ display:flex; align-items:center; gap:11px; padding:9px 12px; background:rgba(255,255,255,.025); border-radius:9px; margin-bottom:7px; }
  .ses:last-child{ margin-bottom:0; }
  .ses-ic{ font-size:17px; }
  .ses-time{ font-size:15px; font-weight:600; letter-spacing:.5px; white-space:nowrap; }
  .ses-lugar{ flex:1; min-width:0; font-size:12.5px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ses-tipo{ font-family:'Bebas Neue',sans-serif; letter-spacing:1.5px; font-size:13px; }
  .ses-edit{ display:flex; align-items:center; gap:6px; padding:7px 0; flex-wrap:wrap; }
  .ses-edit input[type=time], .ses-edit input[type=text], .ses-edit select{ background:#11131f; border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:6px 8px; font-size:13px; font-family:inherit; }
  .ses-edit input[type=text]{ flex:1 1 110px; min-width:90px; }
  .ses-edit .dash{ color:var(--mut); }
  .del{ background:rgba(232,25,44,.12); border:1px solid rgba(232,25,44,.3); color:var(--red); border-radius:7px; width:28px; height:28px; font-size:13px; }
  .add{ background:transparent; border:1px dashed var(--line); color:var(--mut); border-radius:9px; padding:7px 12px; font-size:12px; width:100%; margin-top:4px; }
  #editActions{ display:none; flex-direction:column; gap:8px; position:sticky; bottom:12px; margin-top:14px; }
  .ea-row{ display:flex; gap:10px; }
  #saveBtn{ flex:1; background:var(--red); color:#fff; border:none; border-radius:11px; padding:13px; font-size:14px; font-weight:700; letter-spacing:.5px; }
  #cancelBtn{ background:var(--card); border:1px solid var(--line); color:var(--mut); border-radius:11px; padding:13px 18px; font-size:14px; }
  #resetBtn{ width:100%; background:transparent; border:1px dashed var(--line); color:var(--mut); border-radius:11px; padding:10px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 id="title">🗓️ HORARIOS DE LA SEMANA</h1>
    <button id="editBtn">✏️ Editar</button>
  </div>
  <p class="sub" id="sub"></p>
  <div id="top"></div>
  <div id="status"></div>
  <div id="week"></div>
  <div id="editActions">
    <div class="ea-row">
      <button id="saveBtn">💾 Guardar cambios</button>
      <button id="cancelBtn">Cancelar</button>
    </div>
    <button id="resetBtn">↺ Volver a plantilla base</button>
  </div>
</div>

<script>
(function(){
  var DIAS=[['lunes'],['martes'],['miercoles'],['jueves'],['viernes'],['sabado'],['domingo']];
  // Plantilla base (horario estándar). Las semanas nuevas arrancan con esto.
  var DEFAULT={
    lunes:[{de:'10:00',a:'11:30',tipo:'pesas'},{de:'17:00',a:'19:00',tipo:'voley'}],
    martes:[{de:'10:00',a:'11:30',tipo:'voley'},{de:'18:30',a:'20:30',tipo:'voley'}],
    miercoles:[{de:'10:00',a:'11:30',tipo:'pesas'},{de:'17:00',a:'19:00',tipo:'voley'}],
    jueves:[{de:'10:00',a:'11:30',tipo:'voley'},{de:'18:00',a:'20:00',tipo:'voley'}],
    viernes:[{de:'10:00',a:'11:30',tipo:'pesas'},{de:'17:00',a:'18:30',tipo:'voley'}],
    sabado:[], domingo:[]
  };

  // ── Traducción propia (es / en / de) ─────────────────────────────
  var I18N={
    es:{ titulo:'HORARIOS DE LA SEMANA', sub:'Se sincroniza con el Calendario — se edita desde ahí.',
      editar:'✏️ Editar', cerrar:'✕ Cerrar', voley:'Vóley', pesas:'Pesas', video:'Video', holiday:'Vacaciones', libre:'— libre —',
      agregar:'+ agregar sesión', guardar:'💾 Guardar cambios', cancelar:'Cancelar', reset:'↺ Volver a plantilla base',
      esta:'● Esta semana', base:'🔄 Sincronizado con el Calendario', perso:'Semana personalizada ✓',
      guardado:'Guardado en la nube ✓', sincon:'Sin conexión — no se pudo guardar', semanaDel:'Semana del', al:'al', lugarPh:'📍 ¿Dónde?',
      dias:['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO','DOMINGO'] },
    en:{ titulo:'WEEKLY SCHEDULE', sub:'Synced from the Calendar — edit it there.',
      editar:'✏️ Edit', cerrar:'✕ Close', voley:'Volleyball', pesas:'Gym', video:'Video', holiday:'Holidays', libre:'— off —',
      agregar:'+ add session', guardar:'💾 Save changes', cancelar:'Cancel', reset:'↺ Reset to base template',
      esta:'● This week', base:'🔄 Synced from the Calendar', perso:'Custom week ✓',
      guardado:'Saved to cloud ✓', sincon:'Offline — could not save', semanaDel:'Week of', al:'to', lugarPh:'📍 Where?',
      dias:['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'] },
    de:{ titulo:'WOCHENPLAN', sub:'Mit dem Kalender synchronisiert — dort bearbeiten.',
      editar:'✏️ Bearbeiten', cerrar:'✕ Schließen', voley:'Volleyball', pesas:'Kraftraum', video:'Video', holiday:'Ferien', libre:'— frei —',
      agregar:'+ Einheit hinzufügen', guardar:'💾 Speichern', cancelar:'Abbrechen', reset:'↺ Auf Basisvorlage zurücksetzen',
      esta:'● Diese Woche', base:'🔄 Mit dem Kalender synchronisiert', perso:'Angepasste Woche ✓',
      guardado:'In der Cloud gespeichert ✓', sincon:'Offline — konnte nicht speichern', semanaDel:'Woche vom', al:'bis', lugarPh:'📍 Wo?',
      dias:['MONTAG','DIENSTAG','MITTWOCH','DONNERSTAG','FREITAG','SAMSTAG','SONNTAG'] }
  };
  function L(){ try{ var l=(window.getLang&&window.getLang()); return I18N[l]?l:'es'; }catch(e){ return 'es'; } }
  function t(k){ var d=I18N[L()]; return (d&&d[k]!=null)?d[k]:I18N.es[k]; }

  // ── Fechas (semana = lunes a domingo) ────────────────────────────
  function pad(n){ n=''+n; return n.length<2?'0'+n:n; }
  function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; }
  function addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
  function isoOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function dm(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1); }

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function norm(d){ var o={}; DIAS.forEach(function(x){ o[x[0]]=Array.isArray(d[x[0]])?d[x[0]].filter(Boolean):[]; }); return o; }
  function tipoInfo(tp){
    if(tp==='pesas') return {ic:'🏋️',c:'#f59e0b',lk:'pesas'};
    if(tp==='video') return {ic:'🎥',c:'#3b82f6',lk:'video'};
    if(tp==='holiday') return {ic:'🎄',c:'#22c55e',lk:'holiday'};
    return {ic:'🏐',c:'#e8192c',lk:'voley'};
  }

  var curMonday=mondayOf(new Date());
  var data=clone(DEFAULT);
  var isSaved=false;        // true si esta semana vino de Firebase (personalizada)
  var editing=false;
  var isCoach=(function(){ try{ return (localStorage.getItem('vb_role')||'')!=='player'; }catch(e){ return true; } })();
  var $=function(id){return document.getElementById(id);};

  function weekKey(){ return isoOf(curMonday); }
  function status(msg,col){ var s=$('status'); s.textContent=msg; s.style.color=col||'#22c55e'; s.style.opacity=1; setTimeout(function(){ s.style.opacity=0; },2600); }

  function editRow(key,s,i){
    return '<div class="ses-edit">'
      +'<input type="time" value="'+(s.de||'')+'" data-k="'+key+'" data-i="'+i+'" data-f="de">'
      +'<span class="dash">–</span>'
      +'<input type="time" value="'+(s.a||'')+'" data-k="'+key+'" data-i="'+i+'" data-f="a">'
      +'<input type="text" value="'+esc(s.lugar||'')+'" placeholder="'+t('lugarPh')+'" data-k="'+key+'" data-i="'+i+'" data-f="lugar">'
      +'<select data-k="'+key+'" data-i="'+i+'" data-f="tipo">'
        +'<option value="voley"'+(s.tipo!=='pesas'?' selected':'')+'>🏐 '+t('voley')+'</option>'
        +'<option value="pesas"'+(s.tipo==='pesas'?' selected':'')+'>🏋️ '+t('pesas')+'</option>'
      +'</select>'
      +'<button class="del" data-del="'+key+'" data-i="'+i+'">✕</button>'
    +'</div>';
  }

  function render(){
    // textos fijos
    $('title').textContent='🗓️ '+t('titulo');
    $('sub').textContent=t('sub');
    $('editBtn').textContent=editing?t('cerrar'):t('editar');
    $('saveBtn').textContent=t('guardar'); $('cancelBtn').textContent=t('cancelar'); $('resetBtn').textContent=t('reset');

    // cabecera de semana
    var fin=addDays(curMonday,6);
    var isCur=isoOf(curMonday)===isoOf(mondayOf(new Date()));
    var hdr='<div class="wnav">'
      +'<button class="wbtn" data-nav="-1">‹</button>'
      +'<div class="wrange">'+t('semanaDel')+' '+dm(curMonday)+' '+t('al')+' '+dm(fin)+'</div>'
      +'<button class="wbtn" data-nav="1">›</button>'
      +'</div>'
      +(isCur?'':'<button class="wtoday" data-today="1">'+t('esta')+'</button>')
      +'<div class="wtag '+(isSaved?'perso':'base')+'">'+(isSaved?t('perso'):t('base'))+'</div>';
    $('top').innerHTML=hdr;

    // días
    var h='';
    DIAS.forEach(function(x,idx){
      var key=x[0], ses=data[key]||[];
      h+='<div class="day"><div class="day-lbl">'+t('dias')[idx]+' '+dm(addDays(curMonday,idx))+'</div>';
      if(!ses.length){ h+='<div class="empty">'+t('libre')+'</div>'; }
      ses.forEach(function(s,i){
        if(editing){ h+=editRow(key,s,i); }
        else{ var ti=tipoInfo(s.tipo); var lug=(s.lugar||'').trim(); var _tm=(s.tipo==='holiday')?(s.titulo||t(ti.lk)):(s.de?(s.a?s.de+' – '+s.a:s.de):''); h+='<div class="ses" style="border-left:3px solid '+ti.c+'"><span class="ses-ic">'+ti.ic+'</span><span class="ses-time">'+esc(_tm)+'</span><span class="ses-lugar">'+(lug?'📍 '+esc(lug):'')+'</span><span class="ses-tipo" style="color:'+ti.c+'">'+t(ti.lk)+'</span></div>'; }
      });
      if(editing){ h+='<button class="add" data-add="'+key+'">'+t('agregar')+'</button>'; }
      h+='</div>';
    });
    $('week').innerHTML=h;

    bindNav();
    if(editing) bindEdit();
  }

  function bindNav(){
    $('top').querySelectorAll('[data-nav]').forEach(function(b){
      b.addEventListener('click',function(){ curMonday=addDays(curMonday,parseInt(this.dataset.nav,10)*7); exitEdit(); loadWeek(); });
    });
    var tb=$('top').querySelector('[data-today]');
    if(tb) tb.addEventListener('click',function(){ curMonday=mondayOf(new Date()); exitEdit(); loadWeek(); });
  }
  function bindEdit(){
    $('week').querySelectorAll('input[data-f],select[data-f]').forEach(function(el){
      el.addEventListener('change',function(){ data[this.dataset.k][+this.dataset.i][this.dataset.f]=this.value; });
    });
    $('week').querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click',function(){ data[this.dataset.del].splice(+this.dataset.i,1); render(); });
    });
    $('week').querySelectorAll('[data-add]').forEach(function(b){
      b.addEventListener('click',function(){ data[this.dataset.add].push({de:'17:00',a:'19:00',lugar:'',tipo:'voley'}); render(); });
    });
  }

  function setEditing(on){ editing=on; $('editActions').style.display=on?'flex':'none'; render(); }
  function exitEdit(){ editing=false; $('editActions').style.display='none'; }

  $('editBtn').onclick=function(){ if(!isCoach) return; setEditing(!editing); };
  $('cancelBtn').onclick=function(){ exitEdit(); loadWeek(); };
  $('resetBtn').onclick=function(){ data=clone(DEFAULT); render(); };
  $('saveBtn').onclick=function(){
    data=norm(data);
    if(typeof fbSet!=='undefined'){ fbSet('horarios/semanas/'+weekKey(), data); isSaved=true; status(t('guardado')); }
    else{ status(t('sincon'),'#ef4444'); }
    exitEdit(); render();
  };
  $('editBtn').style.display='none';

  function loadWeek(){
    var monday=curMonday;
    function build(entr){
      var wk={lunes:[],martes:[],miercoles:[],jueves:[],viernes:[],sabado:[],domingo:[]};
      var idx=['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
      (entr||[]).forEach(function(e){
        if(!e.fecha) return;
        var f0=e.fecha, f1=e.fechaFin||e.fecha;
        for(var di=0; di<7; di++){
          var dayIso=isoOf(addDays(monday,di));
          if(dayIso>=f0 && dayIso<=f1){
            var tp = /LIFTING/i.test(e.tipo||'') ? 'pesas' : (/VIDEO/i.test(e.tipo||'') ? 'video' : (/HOLIDAY|VACACION/i.test(e.tipo||'') ? 'holiday' : 'voley'));
            wk[idx[di]].push({ de:e.hora||'', a:e.horaFin||'', tipo:tp, lugar:e.lugar||'', titulo:e.tipo||'' });
          }
        }
      });
      idx.forEach(function(k){ wk[k].sort(function(a,b){ return (a.de||'')<(b.de||'')?-1:1; }); });
      return wk;
    }
    if(typeof fbGet!=='undefined'){
      fbGet('calendario/entrenamientos', function(d){ data=build(Array.isArray(d)?d:[]); isSaved=false; render(); });
    } else { data=clone(DEFAULT); isSaved=false; render(); }
  }

  // re-render si cambian el idioma con el botón de lang.js
  var _lang=L();
  setInterval(function(){ var l=L(); if(l!==_lang){ _lang=l; render(); } },500);

  loadWeek();
})();
</script>
</body>
</html>
