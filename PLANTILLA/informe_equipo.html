<!--
  ══════════════════════════════════════════════════════════════════════════
  informe_equipo.html — EL INFORME, EN UNA PANTALLA

  Los informes que se usan hoy en el voley profesional tienen 100 paginas y
  arrancan con dos de indice. Nadie los lee antes de un partido.

  Este responde tres preguntas y el resto queda a un clic:

     1. ¿Como venimos?        las dos metricas que cubren el 100% de los
                              puntos, cada una contra su valor esperado
     2. ¿Donde perdemos?      el cambio de saque segun como recibimos,
                              comparado con la liga
     3. ¿Quien rinde?         jugador por jugador, real contra esperado

  La idea que lo hace util no es el numero: es la COMPARACION. "64.6% de
  cambio de saque" no dice nada solo. "64.6% cuando lo esperado era 56.3%"
  dice que el ataque esta rindiendo por encima de lo que la recepcion le da.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07080f;--card:#0f1020;--card2:#151730;--txt:#e2e8f0;--mut:#64748b;
      --border:rgba(255,255,255,.07);--ok:#22c55e;--mal:#ef4444;--neu:#94a3b8;
      --club:#e8192c;--azul:#3b82f6}
body{background:var(--bg);color:var(--txt);font-family:'Barlow Condensed',sans-serif;
     -webkit-font-smoothing:antialiased;padding-bottom:60px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:14px;
     padding:16px 0 14px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.back-btn{color:var(--mut);text-decoration:none;font-size:12px;letter-spacing:1.5px;
     text-transform:uppercase;border:1px solid var(--border);border-radius:9px;padding:7px 12px}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px}
.sub{font-size:9px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.kpi-lbl{font-size:11px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
.kpi-row{display:flex;align-items:baseline;gap:12px;margin:8px 0 12px}
.kpi-val{font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:.9;letter-spacing:1px}
.kpi-dif{font-size:14px;font-weight:700}
.barra{position:relative;height:9px;background:#0a0b16;border-radius:5px;overflow:visible}
.barra i{position:absolute;left:0;top:0;height:9px;border-radius:5px;display:block}
.barra u{position:absolute;top:-4px;width:2px;height:17px;background:var(--txt);opacity:.85}
.kpi-pie{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.45}

.sec{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mut);
     font-weight:800;margin:26px 0 4px}
.sec-sub{font-size:12px;color:var(--mut);margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.chart-box{position:relative;width:100%;height:260px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);
   font-weight:700;text-align:right;padding:8px 6px;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.04);text-align:right}
tr:last-child td{border-bottom:0}
.t-name{display:flex;align-items:center;gap:9px}
.t-cam{width:26px;height:26px;border-radius:7px;background:var(--card2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--mut);flex-shrink:0}
.mio td{background:rgba(232,25,44,.07)}
.mio td:first-child{box-shadow:inset 3px 0 0 0 var(--club)}
.dif{font-weight:800}
.tabla-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.minibar{height:7px;background:#0a0b16;border-radius:4px;overflow:hidden;min-width:60px}
.halls{display:grid;gap:9px;margin-bottom:6px}
.hall{background:var(--card);border:1px solid var(--border);border-left:3px solid;
  border-radius:11px;padding:12px 15px}
.hall-top{display:flex;align-items:flex-start;gap:9px}
.hall-ic{font-size:12px;line-height:1.5;flex-shrink:0}
.hall-txt{font-size:15px;font-weight:600;line-height:1.35}
.hall-bot{display:flex;align-items:baseline;gap:12px;margin:6px 0 0 21px;flex-wrap:wrap}
.hall-cost{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px}
.hall-det{font-size:12px;color:var(--mut)}
.minibar i{display:block;height:7px;border-radius:4px}
tr.clic{cursor:pointer}
tr.clic:hover td{background:rgba(255,255,255,.03)}
.vacio{color:var(--mut);font-size:13px;text-align:center;padding:34px 0}
.barra-eq{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.barra-eq label{font-size:10px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase}
.barra-eq select{background:var(--card);color:var(--txt);border:1px solid var(--border);
  border-radius:9px;padding:8px 12px;font-family:inherit;font-size:14px;cursor:pointer;min-width:180px}
.barra-eq select:hover{border-color:rgba(255,255,255,.2)}
.es-rival{color:#f97316;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
</style>

function L(){ try{ return (typeof getLang==='function') ? getLang() : 'es'; }catch(e){ return 'es'; } }
function t(){ return T[L()] || T.es; }

/* ── Ayudas ────────────────────────────────────────────────────────────── */
function n1(x){ return (x===null||x===undefined) ? '—' : Number(x).toFixed(1); }
function difTxt(real, esp){
  if(real===null||esp===null||real===undefined||esp===undefined) return null;
  return Math.round((real-esp)*10)/10;
}
function colorDif(d){ return d===null ? 'var(--mut)' : (d>=0 ? 'var(--ok)' : 'var(--mal)'); }

/* Los nombres de los jugadores salen del plantel, igual que en el resto de las
   pantallas: el informe guarda solo el numero para no repetir el dato. */
function nombreDe(num){
  try{
    var p = (window.EQUIPO_DATA && window.EQUIPO_DATA.jugadores) || [];
    for(var i=0;i<p.length;i++) if(+p[i].num === +num) return p[i].nombre || ('#'+num);
  }catch(e){}
  return '#' + num;
}

/* ── Dibujo ────────────────────────────────────────────────────────────── */
function kpi(lbl, real, esp, color, pieAlto, pieBajo){
  var d = difTxt(real, esp);
  var pie = (d===null) ? '' : (d>=0 ? pieAlto : pieBajo);
  return '<div class="kpi">'
    + '<div class="kpi-lbl">'+lbl+'</div>'
    + '<div class="kpi-row"><span class="kpi-val">'+n1(real)+'%</span>'
    + (d===null ? '' : '<span class="kpi-dif" style="color:'+colorDif(d)+'">'
        + (d>=0?'+':'') + n1(d) + ' ' + (d>=0 ? t().sobre : t().bajo) + '</span>')
    + '</div>'
    + '<div class="barra"><i style="width:'+Math.max(0,Math.min(100,real||0))+'%;background:'+color+'"></i>'
    + (esp===null?'':'<u style="left:'+Math.max(0,Math.min(100,esp))+'%"></u>') + '</div>'
    + '<div class="kpi-pie">' + t().esp + ' ' + n1(esp) + '%' + (pie ? ' · ' + pie : '') + '</div>'
    + '</div>';
}

/* Los cortes de ese jugador, filtrados por recepcion. cortes.html ya entiende
   num y sk, asi que no hace falta nada nuevo del otro lado. */
function verCortes(num){
  try{ window.open('cortes.html?num='+encodeURIComponent(num)+'&sk=Recepcion','_blank'); }catch(e){}
}

function distanciaLiga(pc){
  /* La distancia contra la liga. Dos barras al lado obligan a medir con el
     ojo cual es mas alta; una linea que une los dos valores hace que la
     DIFERENCIA sea lo que se ve —su largo— y el color dice de que lado
     estas. */
  var usa = pc.filter(function(x){ return x.liga !== null && x.n >= 5; });
  if(!usa.length) return '';
  var vals = [];
  usa.forEach(function(x){ vals.push(x.so, x.liga); });
  var min = Math.max(0, Math.min.apply(null, vals) - 8);
  var max = Math.min(100, Math.max.apply(null, vals) + 8);
  var X0 = 140, X1 = 505, alto = 34 + usa.length * 42;
  var px = function(v){ return X0 + (v - min) / (max - min) * (X1 - X0); };

  var g = '';
  usa.forEach(function(x, i){
    var y = 26 + i * 42, a = px(x.so), b = px(x.liga);
    var sube = x.so >= x.liga, col = sube ? '#22c55e' : '#f97316';
    g += '<text x="6" y="' + (y+5) + '" font-size="13" fill="#94a3b8">'
       + (t().cal[x.cal] || x.cal) + '</text>'
       + '<line x1="' + X0 + '" y1="' + y + '" x2="' + X1 + '" y2="' + y + '" stroke="rgba(148,163,184,.16)"/>'
       + '<line x1="' + b + '" y1="' + y + '" x2="' + a + '" y2="' + y + '" stroke="' + col + '" stroke-width="3"/>'
       + '<circle cx="' + b + '" cy="' + y + '" r="5" fill="#0f1020" stroke="#94a3b8" stroke-width="2"/>'
       + '<circle cx="' + a + '" cy="' + y + '" r="6" fill="' + col + '"/>'
       + '<text x="' + (a + (sube ? 13 : -13)) + '" y="' + (y+5) + '" font-size="13" font-weight="700" fill="'
       + col + '" text-anchor="' + (sube ? 'start' : 'end') + '">' + Math.round(x.so) + '%</text>'
       + '<text x="' + (X1+50) + '" y="' + (y+5) + '" font-size="11" fill="#475569" text-anchor="end">n=' + x.n + '</text>';
  });
  g += '<circle cx="' + (X0+6) + '" cy="' + (alto-10) + '" r="4" fill="#0f1020" stroke="#94a3b8" stroke-width="2"/>'
     + '<text x="' + (X0+16) + '" y="' + (alto-6) + '" font-size="11" fill="#475569">' + t().liga + '</text>'
     + '<circle cx="' + (X0+78) + '" cy="' + (alto-10) + '" r="5" fill="#94a3b8"/>'
     + '<text x="' + (X0+88) + '" y="' + (alto-6) + '" font-size="11" fill="#475569">' + t().nos + '</text>';
  return '<div class="panel"><svg viewBox="0 0 560 ' + alto + '" xmlns="http://www.w3.org/2000/svg" '
    + 'style="width:100%;height:auto">' + g + '</svg></div>';
}

function tablaJugadores(js){
  if(!js || !js.length) return '';
  var h = '<div class="tabla-wrap"><table><thead><tr>'
    + '<th>'+t().jug+'</th><th>'+t().rec+'</th><th>'+t().real+'</th>'
    + '<th>'+t().espc+'</th><th>'+t().dif+'</th><th>'+t().pos+'</th><th>'+t().err+'</th>'
    + '</tr></thead><tbody>';
  js.forEach(function(j){
    var d = difTxt(j.so, j.so_esp);
    /* Cada fila lleva a los cortes de video de ESE jugador en recepcion: el
       numero deja de ser un dato y pasa a ser la puerta a las jugadas. */
    h += '<tr class="clic" title="'+t().ver+'" onclick="verCortes('+j.num+')">'
       + '<td><div class="t-name"><div class="t-cam">'+j.num+'</div>'
       + '<span style="font-weight:700">'+nombreDe(j.num)+'</span>'
       + '<span style="opacity:.35;font-size:13px">🎬</span></div></td>'
       + '<td>'+j.n+'</td><td style="font-weight:700">'+n1(j.so)+'%</td>'
       + '<td style="color:var(--mut)">'+n1(j.so_esp)+'%</td>'
       + '<td class="dif" style="color:'+colorDif(d)+'">'+(d>=0?'+':'')+n1(d)+'</td>'
       + '<td>'+n1(j.pos)+'%</td><td style="color:var(--mal)">'+n1(j.err)+'%</td></tr>';
  });
  return h + '</tbody></table></div>';
}


/* ══ Los hallazgos ═══════════════════════════════════════════════════════
   La parte que los informes del mercado no tienen: en vez de cien tablas
   para que el entrenador busque, el sistema se queda con lo que mas pesa y
   lo dice en puntos por partido. */
function panelHallazgos(hs){
  if(!hs || !hs.length) return '';
  var h = '<div class="halls">';
  hs.forEach(function(x){
    var malo = (x.tipo === 'malo');
    var col = malo ? 'var(--mal)' : 'var(--ok)';
    h += '<div class="hall" style="border-left-color:'+col+'">'
       + '<div class="hall-top">'
       + '<span class="hall-ic" style="color:'+col+'">'+(malo?'▼':'▲')+'</span>'
       + '<span class="hall-txt">'+x.txt+'</span></div>'
       + '<div class="hall-bot"><span class="hall-cost" style="color:'+col+'">'
       + (malo?'−':'+') + Math.abs(x.costo) + ' ' + t().ptspp + '</span>'
       + '<span class="hall-det">'+x.det+'</span></div></div>';
  });
  return h + '</div>';
}

function tablaAtaque(as){
  if(!as || !as.length) return '';
  var NOM = {tot:'Total', so:{es:'Tras recepción',en:'After reception',de:'Nach Annahme'}[L()]||'Tras recepción',
             tr:{es:'Contraataque',en:'Counterattack',de:'Gegenangriff'}[L()]||'Contraataque'};
  var h = '<div class="tabla-wrap"><table><thead><tr><th>'+t().fase+'</th><th>N</th>'
    + '<th>'+t().eficacia+'</th><th>'+t().ptos+'</th><th>'+t().errs+'</th><th>'+t().bloq+'</th>'
    + '</tr></thead><tbody>';
  as.forEach(function(a){
    h += '<tr><td style="font-weight:700">'+(NOM[a.fase]||a.fase)+'</td>'
       + '<td style="color:var(--mut)">'+a.n+'</td>'
       + '<td style="font-weight:800;color:#f97316">'+n1(a.eff)+'%</td>'
       + '<td style="color:var(--ok)">'+a.pt+'</td>'
       + '<td style="color:var(--mal)">'+a.err+'</td>'
       + '<td style="color:var(--mut)">'+a.blo+'</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function tablaSaque(ss){
  if(!ss || !ss.length) return '';
  var TS = {Q:{es:'Potencia en salto',en:'Jump power',de:'Sprungaufschlag'},
            M:{es:'Flotado en salto',en:'Jump float',de:'Sprung-Flatter'},
            H:{es:'Flotado parado',en:'Standing float',de:'Flatteraufschlag'},
            T:{es:'Potencia parado',en:'Standing power',de:'Standaufschlag'}};
  var h = '<div class="tabla-wrap"><table><thead><tr><th>'+t().tipo+'</th><th>N</th>'
    + '<th>'+t().bp+'</th><th>'+t().aces+'</th><th>'+t().errs+'</th></tr></thead><tbody>';
  ss.forEach(function(x){
    var nom = (TS[x.tipo] && TS[x.tipo][L()]) || x.tipo;
    h += '<tr><td style="font-weight:700">'+nom+'</td>'
       + '<td style="color:var(--mut)">'+x.n+'</td>'
       + '<td style="font-weight:800">'+n1(x.bp)+'%</td>'
       + '<td style="color:var(--ok)">'+x.ace+' <span style="color:var(--mut);font-size:11px">('+n1(x.ace_pct)+'%)</span></td>'
       + '<td style="color:var(--mal)">'+x.err+' <span style="color:var(--mut);font-size:11px">('+n1(x.err_pct)+'%)</span></td></tr>';
  });
  return h + '</tbody></table></div>';
}

function promedioLiga(D){
  /* El cero de las barras: el cambio de saque promedio de todos los equipos.
     Se calcula con los datos cargados, no con un numero de otro campeonato. */
  var v = (D.equipos || []).map(function(e){ return e.so; }).filter(function(x){ return x !== null; });
  if(!v.length) return 60;
  return Math.round(v.reduce(function(a,b){ return a+b; }, 0) / v.length * 10) / 10;
}

function barrasRotacion(rs, ref){
  /* ══ Las rotaciones, ordenadas de peor a mejor ═══════════════════════════
     Un hexagono se ve lindo pero obliga a comparar AREAS, y el ojo humano las
     mide mal. Con barras se comparan LONGITUDES, que se leen bien, y al
     ordenarlas el problema queda arriba de todo: no hay que buscarlo.
     El cero es el promedio de la liga: a la izquierda por debajo, a la
     derecha por encima. */
  if(!rs || rs.length < 3) return '';
  var lista = rs.filter(function(r){ return r.so !== null; }).map(function(r){
    return {rot:r.rot, so:r.so, n:r.so_n, dif:Math.round((r.so - ref) * 10) / 10};
  });
  if(!lista.length) return '';
  lista.sort(function(a,b){ return a.dif - b.dif; });

  var maxAbs = Math.max.apply(null, lista.map(function(x){ return Math.abs(x.dif); })) || 1;
  var CX = 292, ANCHO = 185, alto = 30 + lista.length * 34;
  var esc = ANCHO / maxAbs;

  var g = '<line x1="' + CX + '" y1="10" x2="' + CX + '" y2="' + (alto-22) + '" '
        + 'stroke="rgba(148,163,184,.45)" stroke-width="1.5"/>'
        + '<text x="' + CX + '" y="' + (alto-6) + '" text-anchor="middle" font-size="11" fill="#475569">'
        + t().promLiga + ' · ' + ref.toFixed(1) + '%</text>';

  lista.forEach(function(x, i){
    var y = 18 + i * 34, w = Math.abs(x.dif) * esc;
    var neg = x.dif < 0, col = neg ? '#f97316' : '#22c55e';
    var x0 = neg ? CX - w : CX;
    g += '<text x="24" y="' + (y+14) + '" font-size="15" font-weight="700" fill="#e2e8f0">' + x.rot + '</text>'
       + '<text x="60" y="' + (y+14) + '" font-size="11" fill="#475569">n=' + x.n + '</text>'
       + '<rect x="' + x0 + '" y="' + y + '" width="' + Math.max(2,w) + '" height="20" rx="3" fill="' + col + '"/>'
       + '<text x="' + (neg ? x0-8 : x0+w+8) + '" y="' + (y+15) + '" text-anchor="' + (neg?'end':'start') + '" '
       + 'font-size="14" font-weight="800" fill="' + col + '">' + (x.dif>0?'+':'') + x.dif + '</text>'
       + '<text x="' + (neg ? x0-54 : x0+w+52) + '" y="' + (y+15) + '" text-anchor="' + (neg?'end':'start') + '" '
       + 'font-size="11" fill="#475569">' + x.so.toFixed(1) + '%</text>';
  });
  return '<div class="panel"><svg viewBox="0 0 560 ' + alto + '" xmlns="http://www.w3.org/2000/svg" '
    + 'style="width:100%;height:auto">' + g + '</svg></div>';
}

function tablaRotaciones(rs){
  if(!rs || !rs.length) return '';
  /* Se pinta la barra proporcional al valor: de un vistazo se ve en que
     rotacion el equipo recibe bien y en cual se le complica, sin tener que
     comparar numeros de a uno. */
  var maxSo = Math.max.apply(null, rs.map(function(r){ return r.so || 0; }));
  var maxBp = Math.max.apply(null, rs.map(function(r){ return r.bp || 0; }));
  var h = '<div class="tabla-wrap"><table><thead><tr>'
    + '<th>'+t().rot+'</th><th>'+t().so+'</th><th></th>'
    + '<th>'+t().bp+'</th><th></th><th>'+t().saldo+'</th></tr></thead><tbody>';
  rs.forEach(function(r){
    h += '<tr><td><div class="t-name"><div class="t-cam">'+r.rot+'</div></div></td>'
       + '<td style="font-weight:700">'+n1(r.so)+'%</td>'
       + '<td style="width:34%"><div class="minibar"><i style="width:'
       + (maxSo ? Math.round(100*(r.so||0)/maxSo) : 0) + '%;background:#1baf7a"></i></div></td>'
       + '<td style="font-weight:700">'+n1(r.bp)+'%</td>'
       + '<td style="width:34%"><div class="minibar"><i style="width:'
       + (maxBp ? Math.round(100*(r.bp||0)/maxBp) : 0) + '%;background:#3b82f6"></i></div></td>'
       + '<td class="dif" style="color:'+(r.dif>=0?'var(--ok)':'var(--mal)')+'">'
       + (r.dif>=0?'+':'')+r.dif+'</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function tablaLiga(eqs, propio){
  var h = '<div class="tabla-wrap"><table><thead><tr>'
    + '<th>'+t().eq+'</th><th>'+t().pj+'</th><th>'+t().so+'</th><th>'+t().espc+'</th>'
    + '<th>'+t().dif+'</th><th>'+t().bp+'</th><th>'+t().espc+'</th><th>'+t().dif+'</th>'
    + '</tr></thead><tbody>';
  eqs.forEach(function(e){
    var d1 = difTxt(e.so, e.so_esp), d2 = difTxt(e.bp, e.bp_esp);
    h += '<tr'+(e.equipo===propio?' class="mio"':'')+'>'
       + '<td style="font-weight:'+(e.equipo===propio?'800':'600')+'">'+e.equipo+'</td>'
       + '<td style="color:var(--mut)">'+e.partidos+'</td>'
       + '<td style="font-weight:700">'+n1(e.so)+'%</td>'
       + '<td style="color:var(--mut)">'+n1(e.so_esp)+'%</td>'
       + '<td class="dif" style="color:'+colorDif(d1)+'">'+(d1>=0?'+':'')+n1(d1)+'</td>'
       + '<td style="font-weight:700">'+n1(e.bp)+'%</td>'
       + '<td style="color:var(--mut)">'+n1(e.bp_esp)+'%</td>'
       + '<td class="dif" style="color:'+colorDif(d2)+'">'+(d2>=0?'+':'')+n1(d2)+'</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function llenarSelector(D, actual){
  var sel = document.getElementById('selEquipo');
  var barra = document.getElementById('barra-eq');
  if(!sel || !barra) return;
  var eqs = (D.equipos || []).filter(function(e){
    return (D.detalles && D.detalles[e.equipo]) || e.equipo === D.propio;
  });
  if(eqs.length < 2){ barra.style.display = 'none'; return; }
  /* el propio primero, despues el resto por orden de rendimiento */
  eqs.sort(function(a,b){
    if(a.equipo === D.propio) return -1;
    if(b.equipo === D.propio) return 1;
    return (b.so||0) - (a.so||0);
  });
  sel.innerHTML = eqs.map(function(e){
    var propio = (e.equipo === D.propio);
    return '<option value="'+e.equipo+'"'+(e.equipo===actual?' selected':'')+'>'
      + e.equipo + (propio ? '  ★' : '') + '  ·  ' + e.partidos + ' PJ</option>';
  }).join('');
  barra.style.display = 'flex';
  sel.onchange = function(){
    window._infEquipo = this.value;
    pintar();
    try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
  };
}

function pintar(){
  var D = window.INFORME_DATA;
  var cont = document.getElementById('cuerpo');
  if(!D || !D.equipos || !D.equipos.length){
    /* Sin partidos de esta temporada. Se explica por que, y se ofrece la
       temporada anterior: al arrancar el año el informe esta vacio y sin este
       mensaje parece que la pantalla esta rota. */
    cont.innerHTML = '<div class="vacio" style="padding:48px 20px">'
      + '<div style="font-size:32px;margin-bottom:12px">📈</div>'
      + '<div style="font-size:15px;color:var(--txt);margin-bottom:6px">'
      + t().sinPartidos + (D && D.temporada ? ' ' + D.temporada : '') + '</div>'
      + '<div style="font-size:13px;color:var(--mut);max-width:380px;margin:0 auto;line-height:1.5">'
      + t().sinPartidosSub + '</div>'
      + '<a href="temporadas.html" class="back-btn" style="display:inline-block;margin-top:18px">'
      + t().verAnterior + '</a></div>';
    return;
  }
  /* El equipo que se esta mirando: el propio por defecto, o el que se eligio
     en el selector. */
  var eqSel = (window._infEquipo || D.propio);
  var mio = null;
  D.equipos.forEach(function(e){ if(e.equipo === eqSel) mio = e; });
  if(!mio){ D.equipos.forEach(function(e){ if(e.equipo === D.propio) mio = e; }); }
  if(!mio) mio = D.equipos[0];
  if(!mio){ cont.innerHTML = '<div class="vacio">'+t().sinDatos+'</div>'; return; }
  eqSel = mio.equipo;
  llenarSelector(D, eqSel);

  /* el detalle del equipo elegido; el propio sigue en 'detalle' por compatibilidad */
  var DET = (D.detalles && D.detalles[eqSel]) || (eqSel === D.propio ? D.detalle : null);

  var sub = document.getElementById('cab-sub');
  if(sub) sub.textContent = eqSel + ' · ' + (D.temporada||'') + ' · ' + mio.partidos + ' PJ'
    + (eqSel !== D.propio ? '  ·  ' + t().rival : '');

  var h = '<div class="kpis">'
    + kpi(t().so, mio.so, mio.so_esp, '#1baf7a', t().so_pie_alto, t().so_pie_bajo)
    + kpi(t().bp, mio.bp, mio.bp_esp, '#3b82f6', t().bp_pie_alto, t().bp_pie_bajo)
    + '</div>';

  var hs = (DET && DET.hallazgos) || [];
  if(hs.length){
    h += '<div class="sec">'+t().hall+'</div><div class="sec-sub">'+t().hallsub+'</div>'
       + panelHallazgos(hs);
  }

  var pc = (DET && DET.por_calidad) || [];
  if(pc.length){
    h += '<div class="sec">'+t().s2+'</div><div class="sec-sub">'+t().s2sub+'</div>'
       + distanciaLiga(pc);
  }

  var js = (DET && DET.jugadores) || [];
  if(js.length){
    h += '<div class="sec">'+t().s3+'</div><div class="sec-sub">'+t().s3sub+'</div>'
       + '<div class="panel">' + tablaJugadores(js) + '</div>';
  }

  var rs = (DET && DET.rotaciones) || [];
  if(rs.length){
    h += '<div class="sec">'+t().s35+'</div><div class="sec-sub">'+t().s35sub+'</div>'
       + barrasRotacion(rs, promedioLiga(D))
       + '<div class="panel" style="margin-top:10px">' + tablaRotaciones(rs) + '</div>';
  }

  var at = (DET && DET.ataque) || [];
  if(at.length){
    h += '<div class="sec">'+t().s5+'</div><div class="sec-sub">'+t().s5sub+'</div>'
       + '<div class="panel">' + tablaAtaque(at) + '</div>';
  }

  var apr = (DET && DET.atk_por_rec) || [];
  if(apr.length){
    h += '<div class="sec">'+t().s6+'</div><div class="sec-sub">'+t().s6sub+'</div>'
       + '<div class="panel"><div class="chart-box" style="height:230px">'
       + '<canvas id="gAtk" role="img" aria-label="'+t().s6sub+'"></canvas></div></div>';
  }

  var sq = (DET && DET.saque) || [];
  if(sq.length){
    h += '<div class="sec">'+t().s7+'</div><div class="sec-sub">'+t().s7sub+'</div>'
       + '<div class="panel">' + tablaSaque(sq) + '</div>';
  }

  h += '<div class="sec">'+t().s4+'</div><div class="sec-sub">'+t().s4sub+'</div>'
     + '<div class="panel">' + tablaLiga(D.equipos, D.propio) + '</div>';

  cont.innerHTML = h;

  if(apr.length) grafAtaque(apr);
}

var CHART = null, CHART2 = null;
function grafAtaque(apr){
  var el = document.getElementById('gAtk'); if(!el || typeof Chart === 'undefined') return;
  if(CHART2){ CHART2.destroy(); CHART2 = null; }
  CHART2 = new Chart(el, {
    type:'bar',
    data:{ labels: apr.map(function(x){ return t().cal[x.cal] || x.cal; }),
      datasets:[{ label:t().eficacia, data:apr.map(function(x){ return x.eff; }),
        backgroundColor:'#f97316', borderRadius:4, maxBarThickness:26 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:function(c){
          return t().eficacia+': '+c.parsed.y.toFixed(1)+'% · n='+apr[c.dataIndex].n; } } } },
      scales:{ y:{ beginAtZero:true, ticks:{color:'#64748b',callback:function(v){return v+'%';}},
                   grid:{color:'rgba(148,163,184,.12)'} },
               x:{ ticks:{color:'#64748b'}, grid:{display:false} } } }
  });
}


/* al cambiar de idioma se vuelve a dibujar: los textos estan adentro */
window.addEventListener('vb-lang', pintar);
document.addEventListener('DOMContentLoaded', pintar);
if(document.readyState !== 'loading') pintar();
</script>
