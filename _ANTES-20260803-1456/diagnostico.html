<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Diagnóstico</title>
<!-- ============================================================================
     diagnostico.html — QUÉ ESTÁ CARGANDO EL NAVEGADOR

     Se pone al lado de las otras páginas y se abre igual que ellas. Carga los
     mismos archivos que el plan de partido y muestra qué llegó y qué no.

     Sirve para dejar de suponer: si el archivo está bien en el repositorio
     pero acá aparece vacío, el problema es de caché o de ruta, no del dato.
     ============================================================================ -->
<style>
  body{background:#0a0f1a;color:#e2e8f0;font-family:ui-monospace,'Cascadia Code',monospace;
       padding:26px;line-height:1.65;font-size:13px}
  h1{font-size:17px;color:#60a5fa;margin:0 0 4px;letter-spacing:1px}
  .sub{color:#64748b;font-size:12px;margin-bottom:22px}
  .b{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .b h2{font-size:12px;color:#94a3b8;margin:0 0 10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
  .ok{color:#22c55e}.no{color:#ef4444}.warn{color:#f59e0b}.mut{color:#64748b}
  table{width:100%;border-collapse:collapse}
  td{padding:3px 8px 3px 0;vertical-align:top}
  td:first-child{color:#94a3b8;white-space:nowrap;width:1%}
  .big{font-size:15px;font-weight:700}
  #copiar{background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:9px 18px;
          font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px}
</style>
</head>
<body>

<h1>DIAGNÓSTICO</h1>
<div class="sub">Qué está cargando el navegador en esta carpeta, ahora mismo.</div>

<div class="b"><h2>Dónde estoy</h2><table id="t-donde"></table></div>
<div class="b"><h2>Los archivos de datos</h2><table id="t-arch"></table></div>
<div class="b"><h2>El equipo y sus jugadores</h2><table id="t-eq"></table></div>
<div class="b"><h2>El armador</h2><table id="t-arm"></table></div>
<div class="b"><h2>Errores</h2><table id="t-err"></table></div>

<button id="copiar" onclick="copiar()">Copiar todo para mandar</button>

<!-- los mismos archivos que carga el plan de partido -->
<script src="liga_data.js" onerror="void 0"></script>
<script src="plan_partido_data.js" onerror="void 0"></script>
<script src="datos_bloqueo.js" onerror="void 0"></script>
<script src="datos_equipo.js" onerror="void 0"></script>
<script src="datos_baterias.js" onerror="void 0"></script>

<script>
var errores = [];
window.addEventListener('error', function(e){
  errores.push((e.message || 'error') + '  ·  ' + (e.filename || '').split('/').pop() +
               ':' + (e.lineno || '?'));
});

function fila(t, k, v, clase){
  var tr = document.createElement('tr');
  tr.innerHTML = '<td>' + k + '</td><td class="' + (clase || '') + '">' + v + '</td>';
  document.getElementById(t).appendChild(tr);
}

function tam(o){
  try { return (JSON.stringify(o) || '').length; } catch(e){ return 0; }
}

setTimeout(function(){

  /* ── dónde estoy ─────────────────────────────────────────────────────── */
  fila('t-donde', 'dirección', location.pathname);
  fila('t-donde', 'carpeta', location.pathname.split('/').slice(0, -1).join('/') || '/');
  fila('t-donde', 'momento', new Date().toLocaleString());

  /* ── los archivos ────────────────────────────────────────────────────── */
  var vars = [
    ['LIGA_DATA',    'la liga (equipos y armadores)'],
    ['PP_DATA',      'el plan de partido'],
    ['PP_BLOCK',     'el bloqueo'],
    ['EQUIPO_DATA',  'el plantel'],
    ['BAT_PARTIDOS', 'las baterías']
  ];
  vars.forEach(function(v){
    var o = window[v[0]];
    if (o === undefined) { fila('t-arch', v[1], 'NO LLEGÓ', 'no'); return; }
    var n = tam(o);
    var det = '';
    if (v[0] === 'LIGA_DATA') det = Object.keys((o.teams) || {}).length + ' equipos';
    if (v[0] === 'PP_DATA')   det = Object.keys(o).length + ' equipos';
    if (v[0] === 'EQUIPO_DATA') det = ((o.jugadores) || []).length + ' jugadores';
    if (v[0] === 'BAT_PARTIDOS') det = (o.total || 0) + ' partidos';
    fila('t-arch', v[1], (n > 200 ? 'ok' : 'VACÍO') + '  ·  ' + det + '  ·  ' +
         Math.round(n / 1024) + ' KB', n > 200 ? 'ok' : 'warn');
  });

  /* ── el equipo ───────────────────────────────────────────────────────── */
  var PP = window.PP_DATA || {};
  var claves = Object.keys(PP);
  fila('t-eq', 'equipos en el plan', claves.join(', ') || '(ninguno)',
       claves.length ? '' : 'no');

  var qp = new URLSearchParams(location.search);
  var TEAM = (qp.get('equipo') || claves[0] || '').toLowerCase();
  fila('t-eq', 'equipo elegido', TEAM || '(ninguno)');

  var t = PP[TEAM];
  fila('t-eq', '¿existe?', t ? 'SÍ' : 'NO — por eso sale vacío', t ? 'ok' : 'no');

  if (t) {
    var P = t.players || [];
    fila('t-eq', 'entradas de jugador', P.length, P.length ? 'ok' : 'no');
    var nums = {};
    P.forEach(function(p){ nums[p.num] = (nums[p.num] || 0) + 1; });
    fila('t-eq', 'jugadores distintos', Object.keys(nums).length);
    fila('t-eq', 'los números', Object.keys(nums).sort(function(a,b){return a-b;}).join(', '));
    var jug = qp.get('jug');
    if (jug) {
      var suyas = P.filter(function(p){ return String(p.num) === String(jug); });
      fila('t-eq', 'el jugador ' + jug,
           suyas.length ? ('SÍ — ' + suyas.map(function(p){
             return p.id + ' (' + p.total + ')'; }).join(', ')) : 'NO ESTÁ',
           suyas.length ? 'ok' : 'no');
    }
  }

  /* ── el armador ──────────────────────────────────────────────────────── */
  var L = window.LIGA_DATA || {};
  var eqs = Object.keys(L.teams || {});
  fila('t-arm', 'equipos en la liga', eqs.join(', ') || '(ninguno)', eqs.length ? '' : 'no');
  var mio = L.teams && L.teams[TEAM];
  fila('t-arm', '¿está el mío?', mio ? 'SÍ' : 'NO — la solapa de armado sale vacía',
       mio ? 'ok' : 'no');
  if (mio) {
    var st = mio.setters || [];
    fila('t-arm', 'armadores', st.length ?
         st.map(function(s){ return '#' + s.num + ' ' + s.name +
           ' (' + ((s.s || []).length) + ')'; }).join(' · ') : 'ninguno',
         st.length ? 'ok' : 'no');
  }

  /* ── errores ─────────────────────────────────────────────────────────── */
  if (!errores.length) fila('t-err', '', 'ninguno', 'ok');
  else errores.forEach(function(e, i){ fila('t-err', i + 1, e, 'no'); });

}, 900);

function copiar(){
  var t = document.body.innerText.replace(/\n{3,}/g, '\n\n');
  navigator.clipboard.writeText(t).then(function(){
    var b = document.getElementById('copiar');
    b.textContent = 'Copiado — pegalo en el chat';
    setTimeout(function(){ b.textContent = 'Copiar todo para mandar'; }, 2500);
  });
}
</script>
</body>
</html>
